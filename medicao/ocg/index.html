*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg2);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.45;font-variant-numeric:tabular-nums}
a{color:var(--azul)}
button,select,input{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
/* ---------- topo ---------- */
.topo{background:#3871C1;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.marca{display:flex;flex-direction:column;line-height:1;padding-right:22px;border-right:1px solid rgba(255,255,255,.35)}
.marca b{font-size:26px;letter-spacing:.12em;font-weight:900}
.marca span{font-size:9px;letter-spacing:.34em;margin-top:5px;opacity:.9}
.titulo h1{font-size:20px;font-weight:700;letter-spacing:.01em}
.titulo p{margin:3px 0 0;font-size:12px;opacity:.9}
.meta{margin-left:auto;display:flex;gap:18px;font-size:12px}
.meta div{display:flex;flex-direction:column;gap:2px}
.meta small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.meta b{font-size:14px}
/* ---------- abas ---------- */
.abas{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--linha);display:flex;gap:2px;padding:0 16px;overflow-x:auto;scrollbar-width:thin}
.abas button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 12px 9px;color:var(--ink2);cursor:pointer;white-space:nowrap;font-size:12.5px;font-weight:700;letter-spacing:.01em}
.abas button:hover{color:var(--ink);background:var(--bg2)}
.abas button.on{color:var(--azul);border-bottom-color:var(--azul)}
.abas button:focus-visible{outline:2px solid var(--azul);outline-offset:-2px}
main{padding:18px 24px 48px;max-width:1600px;margin:0 auto}
.view{display:none}.view.on{display:block}
/* ---------- blocos ---------- */
.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.sec-h h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--azul);font-weight:700}
.sec-h .sub{font-size:12px;color:var(--ink3)}
.painel{background:var(--bg);border:1px solid var(--linha);border-radius:6px;padding:14px 16px;box-shadow:var(--sombra)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--bg);border:1px solid var(--linha);border-top:4px solid var(--azul);border-radius:6px;padding:12px 14px 12px;box-shadow:var(--sombra);min-width:0}
.kpi.ouro{border-top-color:var(--ouro)}
.kpi.crit{border-top-color:var(--crit)}.kpi.warn{border-top-color:var(--warn)}.kpi.ok{border-top-color:var(--ok)}
.kpi small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.kpi b{display:block;font-size:22px;font-weight:700;color:var(--azul);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.ouro b{color:var(--ouro)}.kpi.crit b{color:var(--crit)}.kpi.warn b{color:var(--warn)}.kpi.ok b{color:var(--ok)}
.kpi em{display:block;font-style:normal;font-size:11.5px;color:var(--ink3);margin-top:4px}
/* ---------- filtros ---------- */
.filtros{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end;padding:12px 14px;background:var(--bg);border:1px solid var(--linha);border-radius:6px;margin-bottom:14px}
.filtros label{display:flex;flex-direction:column;gap:3px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.filtros select,.filtros input{border:1px solid var(--linha);background:var(--bg);border-radius:4px;padding:6px 8px;font-size:12.5px;min-width:130px;max-width:290px}
.filtros input[type=text],.filtros input[type=search]{min-width:220px}
.filtros input[type=number]{min-width:110px;max-width:140px}
.filtros .chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--linha);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--azul);border-color:var(--azul);color:#fff}
.btn{border:1px solid var(--linha);background:var(--bg);border-radius:4px;padding:6px 10px;font-size:12px;cursor:pointer;color:var(--ink)}
.btn:hover{background:var(--bg2)}
.btn.pri{background:var(--azul);border-color:var(--azul);color:#fff}
.conta{font-size:12px;color:var(--ink3);margin-left:auto;align-self:center}
/* ---------- tabelas ---------- */
.tw{overflow-x:auto;border:1px solid var(--linha);border-radius:6px;background:var(--bg)}
.tw.alto{max-height:70vh;overflow-y:auto}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.3px}
thead th{position:sticky;top:0;z-index:2;background:var(--azul-esc);color:#fff;font-weight:700;text-align:left;padding:8px 9px;white-space:nowrap;font-size:11px;letter-spacing:.04em;border-bottom:1px solid var(--linha)}
:root[data-theme="dark"] thead th{background:#2B4E80}
thead th.num{text-align:right}
thead th.sort{cursor:pointer;user-select:none}
thead th.sort:hover{background:var(--azul)}
thead th .seta{opacity:.6;font-size:9px;margin-left:3px}
tbody td{padding:6px 9px;border-bottom:1px solid var(--linha2);vertical-align:top}
tbody tr:nth-child(even) td{background:var(--bg2)}
tbody tr:hover td{background:var(--azul-tint)}
tbody tr.clk{cursor:pointer}
td.num,th.num{text-align:right;white-space:nowrap}
td.neg{color:var(--crit)}
td.pos{color:var(--ok)}
tfoot td,tr.total td{background:var(--ouro-tint)!important;color:var(--ink);font-weight:700;border-top:2px solid var(--ouro);padding:7px 9px;white-space:nowrap}
tr.grp td{background:var(--azul-tint)!important;font-weight:700;color:var(--azul-esc);cursor:pointer}
tr.grp.n2 td{background:var(--bg3)!important;color:var(--ink);font-weight:700}
tr.grp td .tri{display:inline-block;width:14px;color:var(--ink3);transition:transform .15s}
tr.grp.fechado td .tri{transform:rotate(-90deg)}
td.desc{min-width:280px;max-width:520px;white-space:normal}
td.mono{font-family:Consolas,Menlo,monospace;font-size:11.5px;white-space:nowrap}
.barra{display:inline-block;height:8px;border-radius:2px;background:var(--azul);vertical-align:middle;margin-right:6px}
.barra.ouro{background:var(--ouro)}.barra.crit{background:var(--crit)}.barra.warn{background:var(--warn)}.barra.ok{background:var(--ok)}
.pct{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pct i{display:inline-block;width:70px;height:7px;background:var(--bg3);border-radius:2px;overflow:hidden}
.pct i b{display:block;height:100%;background:var(--azul);border-radius:2px}
.tag{display:inline-block;padding:2px 7px;border-radius:3px;font-size:10.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.tag.A{background:var(--azul);color:#fff}.tag.B{background:var(--azul-tint2);color:var(--azul-esc)}.tag.C{background:var(--bg3);color:var(--ink2)}
.tag.ok{background:var(--ok-tint);color:var(--ok)}.tag.warn{background:var(--warn-tint);color:var(--warn)}.tag.crit{background:var(--crit-tint);color:var(--crit)}.tag.neu{background:var(--bg3);color:var(--ink2)}
.emp{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.emp i{width:9px;height:9px;border-radius:2px;display:inline-block}
.emp.MARKA i{background:var(--s-marka)}.emp.KLOG i{background:var(--s-klog)}.emp.VCA i{background:var(--s-vca)}.emp.x i{background:var(--ink3)}
/* heatmap */
.heat td.h{text-align:right;padding:5px 7px;font-size:11.5px}
/* charts */
.ch{position:relative;height:280px}
.ch.baixo{height:220px}.ch.alto{height:360px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-bottom:6px}
.leg span{display:inline-flex;align-items:center;gap:5px}.leg i{width:10px;height:10px;border-radius:2px;display:inline-block}
/* dica */
.dica{border-left:3px solid var(--ouro);background:var(--ouro-tint);padding:9px 12px;border-radius:0 4px 4px 0;font-size:12.3px;color:var(--ink);margin-top:10px}
.dica b{color:var(--ink)}
.nota{font-size:11.5px;color:var(--ink3);margin-top:8px}
/* drawer */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--bg);border-left:1px solid var(--linha);box-shadow:-8px 0 24px rgba(0,0,0,.15);z-index:40;transform:translateX(100%);transition:transform .2s;overflow-y:auto;padding:18px 20px}
.drawer.on{transform:none}
.drawer h3{font-size:15px;color:var(--azul);margin-bottom:4px}
.drawer .fech{position:absolute;top:10px;right:12px}
.dl{display:grid;grid-template-columns:150px 1fr;gap:4px 10px;font-size:12.3px;margin:12px 0}
.dl dt{color:var(--ink3);text-transform:uppercase;font-size:10.5px;letter-spacing:.08em;padding-top:2px}
.dl dd{margin:0}
.rodape{margin-top:32px;padding-top:12px;border-top:2px solid var(--azul);font-size:11.5px;color:var(--ink3);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media (max-width:760px){.topo{padding:12px 14px}.meta{margin-left:0}main{padding:12px 12px 40px}.kpi b{font-size:18px}}

.leg-exp{font-size:12.3px;color:var(--ink2);background:var(--bg2);border-left:3px solid var(--azul);padding:8px 12px;border-radius:0 4px 4px 0;margin-bottom:12px}
.leg-exp b{color:var(--ink)}
.sel-lin{display:flex;gap:6px;flex-wrap:wrap}
.sel-lin button{border:1px solid var(--linha);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:11.5px;cursor:pointer;color:var(--ink2)}
.sel-lin button.on{background:var(--azul);border-color:var(--azul);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const CAT6 = ['--c1', '--c2', '--c3', '--c4', '--c5', '--c6'];
const corCat = i => css(CAT6[i % 6]);

/* ---------- 1. BUMP · posição no ranking período a período ---------- */
function bumpChart(canvas, series, labels, opt = {}) {
  // series: [{nome, v:[...]}] — o ranking é recalculado em cada período
  const N = labels.length, S = series.length;
  const rank = series.map(() => new Array(N).fill(null));
  for (let k = 0; k < N; k++) {
    const ord = series.map((s, i) => ({ i, v: s.v[k] })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
    ord.forEach((x, pos) => rank[x.i][k] = pos + 1);
  }
  const ds = series.map((s, i) => ({
    label: s.nome, data: rank[i], borderColor: corCat(i), backgroundColor: corCat(i),
    borderWidth: 2.5, pointRadius: 5, pointHoverRadius: 8, pointBorderColor: css('--bg'), pointBorderWidth: 2,
    tension: 0, spanGaps: false,
  }));
  return chart(canvas, { type: 'line', data: { labels, datasets: ds }, options: {
    scales: { y: { reverse: true, min: .5, max: S + .5, ticks: { stepSize: 1, callback: v => Number.isInteger(v) && v >= 1 && v <= S ? v + 'º' : '' }, title: { display: true, text: 'posição no ranking', color: css('--ink3') } },
      x: { ticks: { maxRotation: 0, autoSkip: false, font: { size: 10 } } } },
    plugins: { tooltip: { callbacks: {
      title: c => labels[c[0].dataIndex],
      label: c => ` ${c.parsed.y}º · ${c.dataset.label}: ${fK(series[c.datasetIndex].v[c.dataIndex])}` } } } } });
}

/* ---------- 2. SLOPE · o que mudou entre dois momentos ---------- */
function slopeChart(canvas, linhas, rotA, rotB, opt = {}) {
  // linhas: [{nome, a, b}] — dois pontos por linha
  const fmt = opt.fmt || fK;
  const ds = linhas.map((l, i) => {
    const sobe = l.b >= l.a;
    const c = opt.corPorSinal ? (sobe ? css('--crit') : css('--ok')) : corCat(i);
    return { label: l.nome, data: [l.a, l.b], borderColor: c, backgroundColor: c, borderWidth: 2.5,
      pointRadius: 6, pointHoverRadius: 9, pointBorderColor: css('--bg'), pointBorderWidth: 2, tension: 0 };
  });
  return chart(canvas, { type: 'line', data: { labels: [rotA, rotB], datasets: ds }, options: {
    layout: { padding: { right: 12, left: 12 } },
    scales: { x: { grid: { display: false }, ticks: { font: { size: 12, weight: '700' } } },
      y: { ticks: { callback: v => fmt(v) } } },
    plugins: { tooltip: { callbacks: {
      label: c => ` ${c.dataset.label}: ${fmt(c.parsed.y)}`,
      afterBody: c => { const l = linhas[c[0].datasetIndex]; const d = l.b - l.a;
        return `variação ${d >= 0 ? '+' : ''}${fmt(d)}${l.a ? ` (${d / l.a >= 0 ? '+' : ''}${fP(d / l.a, 0)})` : ''}`; } } } } } });
}

/* ---------- 3. CASCATA · como se chega de um total a outro ---------- */
function cascataChart(canvas, passos, opt = {}) {
  // passos: [{nome, v, tipo:'inicio'|'delta'|'total'}]
  const fmt = opt.fmt || fK;
  let acum = 0; const flut = [], cores = [], valores = [];
  for (const p of passos) {
    if (p.tipo === 'inicio' || p.tipo === 'total') { const base = p.tipo === 'inicio' ? 0 : 0; const topo = p.tipo === 'inicio' ? p.v : acum;
      flut.push([base, p.tipo === 'inicio' ? p.v : acum]); valores.push(p.tipo === 'inicio' ? p.v : acum);
      cores.push(css('--azul-esc')); if (p.tipo === 'inicio') acum = p.v; }
    else { const ini = acum; acum += p.v; flut.push([Math.min(ini, acum), Math.max(ini, acum)]); valores.push(p.v);
      cores.push(p.v >= 0 ? css('--ok') : css('--c2')); }

    options: { scales: { x: { ticks: { maxRotation: 30, minRotation: 0, autoSkip: false, font: { size: 10 } } }, y: { ticks: { callback: v => fmt(v) } } },
      plugins: { tooltip: { callbacks: { label: c => { const p = passos[c.dataIndex];
        return p.tipo === 'delta' ? ` ${p.v >= 0 ? 'entra' : 'sai'} ${fmt(Math.abs(p.v))}` : ` ${fmt(valores[c.dataIndex])}`; },
        afterLabel: c => passos[c.dataIndex].nota || '' } } } } });
}

/* ---------- 4. HISTOGRAMA COM DENSIDADE ---------- */
function kde(dados, grade, banda) {
  // núcleo gaussiano; banda por regra de Silverman se não informada
  const n = dados.length; if (!n) return grade.map(() => 0);
  const media = sum(dados) / n;
  const dp = Math.sqrt(sum(dados.map(x => (x - media) ** 2)) / n) || 1;
  const ord = [...dados].sort((a, b) => a - b);
  const q = p => ord[Math.min(n - 1, Math.max(0, Math.floor(p * (n - 1))))];
  const iqr = q(.75) - q(.25);
  const bw = banda || 0.9 * Math.min(dp, iqr / 1.349 || dp) * Math.pow(n, -0.2) || dp / 3;
  return grade.map(x => sum(dados.map(d => Math.exp(-0.5 * ((x - d) / bw) ** 2))) / (n * bw * Math.sqrt(2 * Math.PI)));
}
function histogramaDensidade(canvas, dados, opt = {}) {
  const nbins = opt.bins || Math.max(8, Math.min(24, Math.ceil(Math.sqrt(dados.length))));
  const min = opt.min !== undefined ? opt.min : Math.min(...dados);
  const max = opt.max !== undefined ? opt.max : Math.max(...dados);
  const larg = (max - min) / nbins || 1;
  const centros = [], contagem = new Array(nbins).fill(0);
  for (let i = 0; i < nbins; i++) centros.push(min + larg * (i + .5));
  for (const d of dados) { let i = Math.floor((d - min) / larg); if (i >= nbins) i = nbins - 1; if (i < 0) i = 0; contagem[i]++; }
  // densidade na mesma unidade da contagem: dens × n × largura do bin
  const dens = kde(dados, centros, opt.banda).map(v => v * dados.length * larg);
  const fmt = opt.fmt || (v => v.toLocaleString('pt-BR', { maximumFractionDigits: 1 }));
  return chart(canvas, { data: { labels: centros.map(c => fmt(c)), datasets: [
      { type: 'bar', label: 'Itens no intervalo', data: contagem, backgroundColor: css('--azul-claro'), borderRadius: 3, barPercentage: 1, categoryPercentage: .92, order: 2 },
      { type: 'line', label: 'Densidade', data: dens, borderColor: css('--ouro'), backgroundColor: 'transparent', borderWidth: 2.5, pointRadius: 0, tension: .35, order: 1 }] },
    options: { scales: { x: { ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 10, font: { size: 10 } }, title: { display: !!opt.eixoX, text: opt.eixoX || '', color: css('--ink3') } },
        y: { title: { display: true, text: 'nº de ocorrências', color: css('--ink3') } } },
      plugins: { tooltip: { callbacks: {
        title: c => `${opt.rotulo || 'faixa'} ≈ ${c[0].label}`,
        label: c => c.dataset.type === 'bar' ? ` ${c.parsed.y} ocorrência(s)` : ` densidade ${c.parsed.y.toLocaleString('pt-BR', { maximumFractionDigits: 1 })}` } } } } });
}

    ${selectHTML('ativo', 'Ativo / Frente', ATIVOS, F.ativo, 'Todos')}${selectHTML('n1', 'Subitem nível 01', n1s, F.n1, 'Todos')}
    ${selectHTML('contrato', 'Contrato', CONTR, F.contrato, 'Todos')}${selectHTML('emp', 'Empresa', EMPS, F.emp, 'Todas')}
    ${selectHTML('defl', 'Deflator', ['DEFLATOR', 'NÃO CONSIDERAR DEFLATOR'], F.defl, 'Todos')}${selectHTML('abc', 'Classe ABC', ['A', 'B', 'C'], F.abc, 'Todas')}
    ${selectHTML('st', 'Situação', ['em andamento', 'parado', 'não iniciado', 'estourado', 'concluído', 'sem saldo'], F.st, 'Todas')}
    <label>Colunas<span class="chips">${[['resumo', 'Resumo'], ['bm', 'Medição por BM'], ['base', 'Base contratual']].map(c => `<button class="chip ${F.cols === c[0] ? 'on' : ''}" data-c="${c[0]}">${c[1]}</button>`).join('')}</span></label>
    <label>Agrupar<span class="chips"><button class="chip ${F.grp ? 'on' : ''}" id="grp">Ativo › Nível 01 › Nível 02</button></span></label>
    <button class="btn" id="limpar">Limpar filtros</button><span class="conta" id="conta"></span>`;
  }
  const out = el('div'); root.append(f, out);
  function bind() {
    f.innerHTML = filtrosHTML();
    f.querySelector('#q').oninput = e => { F.q = e.target.value; draw(); };
    ['ativo', 'n1', 'contrato', 'emp', 'defl', 'abc', 'st'].forEach(k => f.querySelector('#' + k).onchange = e => { F[k] = e.target.value; if (k === 'ativo') F.n1 = ''; bind(); });
    f.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { F.cols = b.dataset.c; bind(); });
    f.querySelector('#grp').onclick = () => { F.grp = !F.grp; bind(); };
    f.querySelector('#limpar').onclick = () => { Object.assign(F, { q: '', ativo: '', n1: '', contrato: '', emp: '', defl: '', abc: '', st: '' }); bind(); };
    draw();
  }
  function filtrar() {
    const q = F.q.trim().toLowerCase();
    return IT.filter(i => (!F.ativo || i.ativo === F.ativo) && (!F.n1 || i.n1 === F.n1) && (!F.contrato || i.contrato === F.contrato) && (!F.emp || i.emp === F.emp) && (!F.defl || i.deflator === F.defl) && (!F.abc || i.abc === F.abc) && (!F.st || i.status === F.st)
      && (!q || i.desc.toLowerCase().includes(q) || i.item.toLowerCase().includes(q) || i.sgc.toLowerCase().includes(q) || i.cm.toLowerCase().includes(q) || i.n2.toLowerCase().includes(q)));
  }
  function cols() {
    const base = [COL.item, COL.descT, COL.emp, COL.un, COL.pu];
    if (F.cols === 'resumo') return [...base, COL.qtd, COL.pt, COL.qm, COL.vm, COL.qs, COL.vs, COL.pct, { t: 'Últ. 3 BMs', k: 'l3', num: true, f: fR0 }, COL.abc, COL.status];
    if (F.cols === 'base') return [...base, { t: 'Contrato', k: 'contrato' }, { t: 'Deflator', k: 'deflator', f: v => v === 'DEFLATOR' ? 'sim' : v ? 'não' : '' }, { t: 'CT inicial', k: r => r.base.ct, num: true, f: fQ }, { t: 'OIN', k: r => r.base.oin, num: true, f: fQ }, { t: 'TAC 1', k: r => r.base.tac1, num: true, f: fQ }, { t: 'TAC 2', k: r => r.base.tac2, num: true, f: fQ }, { t: 'TAC 3', k: r => r.base.tac3, num: true, f: fQ }, { t: 'TAC 4', k: r => r.base.tac4, num: true, f: fQ }, COL.qtd, COL.pt, { t: 'CM unificado', k: 'cm' }, { t: 'SGC', k: 'sgc' }];
    return [...base, COL.qtd, ...BMS.map((b, k) => ({ t: b, k: r => r.bm[k], num: true, f: (v, r) => v ? `<span title="${fR(r.bmv[k])}">${fQ(v)}</span>` : '<span style="color:var(--ink3)">·</span>' })), COL.qm, COL.vm];
  }
  function draw() {
    const rows = filtrar(); const cs = cols(); const t = tot(rows);
    f.querySelector('#conta').textContent = `${fN(rows.length)} de ${fN(IT.length)} itens · previsto ${fK(t.pt)} · medido ${fK(t.vm)} · saldo ${fK(t.vs)}`;
    out.innerHTML = '';
    const total = (rs, c, i) => { if (i === 0) return 'TOTAL'; if (c === COL.pt) return fR(sum(rs, r => r.pt)); if (c === COL.vm) return fR(sum(rs, r => r.vm)); if (c === COL.vs) return fR(sum(rs, r => r.vs)); if (c === COL.pct) { const p = sum(rs, r => r.pt); return p ? fP(sum(rs, r => r.vm) / p) : '–'; } if (c.k === 'l3') return fR0(sum(rs, r => r.l3)); if (F.cols === 'bm' && typeof c.k === 'function' && c.t.startsWith('BM')) { const k = BMS.indexOf(c.t); return fK(sum(rs, r => r.bmv[k])); } return ''; };
    if (!F.grp) { out.appendChild(tabela(cs, rows, { alto: true, total, clique: abrirItem })); return; }
    // agrupado: monta manualmente com linhas de grupo colapsáveis
    const w = el('div', 'tw alto'); const grupos = new Map();
    for (const r of rows) { const k1 = r.ativo, k2 = r.n1 || '(sem nível 01)', k3 = r.n2 || '(sem nível 02)'; if (!grupos.has(k1)) grupos.set(k1, new Map()); const g1 = grupos.get(k1); if (!g1.has(k2)) g1.set(k2, new Map()); const g2 = g1.get(k2); if (!g2.has(k3)) g2.set(k3, []); g2.get(k3).push(r); }
    const sub = (list, cls, nome, nivel, id) => { const t = tot(list); return `<tr class="grp ${cls}" data-g="${id}" data-nivel="${nivel}"><td colspan="5"><span class="tri">▼</span>${h(nome)} <span style="color:var(--ink3);font-weight:400">· ${list.length} itens</span></td>${cs.slice(5).map(c => `<td class="num">${c === COL.pt ? fR0(t.pt) : c === COL.vm ? fR0(t.vm) : c === COL.vs ? fR0(t.vs) : c === COL.pct ? (t.pt ? fP(t.vm / t.pt) : '–') : ''}</td>`).join('')}</tr>`; };
    let html = '<table><thead><tr>' + cs.map(c => `<th class="${c.num ? 'num' : ''}">${h(c.t)}</th>`).join('') + '</tr></thead><tbody>'; let gid = 0;
    for (const [k1, g1] of grupos) { const l1 = [...g1.values()].flatMap(m => [...m.values()].flat()); const id1 = 'g' + (++gid); html += sub(l1, 'n1', k1, 1, id1);
      for (const [k2, g2] of g1) { const l2 = [...g2.values()].flat(); const id2 = 'g' + (++gid); html += sub(l2, 'n2', k2, 2, id2).replace('data-g=', `data-p="${id1}" data-g=`);
        for (const [k3, l3] of g2) { const id3 = 'g' + (++gid); html += `<tr class="grp n3" data-p="${id1} ${id2}" data-g="${id3}" data-nivel="3"><td colspan="${cs.length}" style="background:var(--bg)!important;color:var(--ink2);font-weight:700;padding-left:22px"><span class="tri">▼</span>${h(k3)} <span style="color:var(--ink3);font-weight:400">· ${l3.length} itens · medido ${fK(sum(l3, r => r.vm))}</span></td></tr>`;
          for (const r of l3) html += `<tr class="clk" data-p="${id1} ${id2} ${id3}" data-idx="${r.idx}">` + cs.map(c => { const v = typeof c.k === 'function' ? c.k(r) : r[c.k]; return `<td class="${c.num ? (c.neg ? numCls(v) : 'num') : (c.cls || '')}">${c.f ? c.f(v, r) : h(v ?? '')}</td>`; }).join('') + '</tr>'; } } }
    html += '</tbody><tfoot><tr>' + cs.map((c, i) => `<td class="${c.num ? 'num' : ''}">${total(rows, c, i) ?? ''}</td>`).join('') + '</tr></tfoot></table>';
    w.innerHTML = html; out.appendChild(w);
    const fechados = new Set();
    w.querySelectorAll('tr.grp').forEach(tr => tr.onclick = () => { const g = tr.dataset.g; if (fechados.has(g)) fechados.delete(g); else fechados.add(g); tr.classList.toggle('fechado', fechados.has(g)); aplicar(); });
    function aplicar() { w.querySelectorAll('tr[data-p]').forEach(tr => { const ps = tr.dataset.p.split(' '); tr.style.display = ps.some(p => fechados.has(p)) ? 'none' : ''; }); }
    w.querySelectorAll('tr.clk').forEach(tr => tr.onclick = () => abrirItem(IT[+tr.dataset.idx]));
    // começa com nível 3 fechado quando há muitos itens
    if (rows.length > 120) { w.querySelectorAll('tr.grp.n3').forEach(tr => { fechados.add(tr.dataset.g); tr.classList.add('fechado'); }); aplicar(); }
  }
  bind();
  root.appendChild(el('div', 'nota', 'Clique em um item para abrir o histórico de medição por BM. Clique no cabeçalho de grupo para recolher ou expandir. As colunas calculadas (Preço Total, Qtd Medida, Valor Medido, Saldo, Classe ABC) seguem exatamente as fórmulas da tabela Cadastro_QQP5.'));
}
function abrirItem(i) {

  <dt>Preço total</dt><dd>${fR(i.pt)}</dd><dt>Qtd medida</dt><dd>${fQ(i.qm)} <span style="color:var(--ink3)">(${i.pt ? fP(i.vm / i.pt) : '–'})</span></dd><dt>Valor medido</dt><dd>${fR(i.vm)}</dd><dt>Saldo</dt><dd class="${i.vs < 0 ? 'neg' : ''}" style="${i.vs < 0 ? 'color:var(--crit)' : ''}">${fQ(i.qs)} ${h(i.un)} · ${fR(i.vs)}</dd></dl>
  <div class="sec-h"><h2>Medição por BM</h2></div><div class="ch baixo"><canvas></canvas></div>
  <div class="tw" style="margin-top:10px"><table><thead><tr><th>BM</th><th class="num">Qtd</th><th class="num">R$</th><th class="num">Acum. R$</th><th class="num">% item</th></tr></thead><tbody>${(() => { let a = 0; return BMS.map((b, k) => { a += i.bmv[k]; return i.bm[k] ? `<tr><td>${b}</td><td class="num">${fQ(i.bm[k])}</td><td class="${numCls(i.bmv[k])}">${fR(i.bmv[k])}</td><td class="num">${fR(a)}</td><td class="num">${i.pt ? fP(a / i.pt) : '–'}</td></tr>` : ''; }).join(''); })()}</tbody></table></div>`;
  d.classList.add('on'); d.querySelector('#fech').onclick = () => d.classList.remove('on');
  chart(d.querySelector('canvas'), { type: 'bar', data: { labels: BMS, datasets: [{ data: i.bmv, backgroundColor: i.bmv.map(v => v < 0 ? css('--crit') : css('--azul')), borderRadius: 3, barPercentage: .6 }] }, options: { plugins: { tooltip: tipR } } });
}

/* ---------- 3. BASE KPI ---------- */
function vKPI(root) {
  root.appendChild(el('div', 'kpis', [kpi('Valor contratual total', fR(TOT.ct)), kpi('Valor medido acumulado', fR(TOT.vm), '', 'ouro'), kpi('Saldo contratual', fR(TOT.vs)), kpi('% Avanço financeiro', fP(TOT.pct))].join('')));
  let a = 0; const ev = BMS.map((b, k) => { a += TOT.porBM[k]; return { bm: b, per: TOT.porBM[k], acc: a, pct: a / TOT.ct, saldo: TOT.ct - a, part: TOT.porBM[k] / TOT.vm }; });
  root.appendChild(sec('Evolução por BM (mês a mês)', '', tabela([{ t: 'BM', k: 'bm' }, { t: 'Medido no período (R$)', k: 'per', num: true, neg: true, f: fR }, { t: 'Part. no medido', k: 'part', num: true, f: v => fP(v) }, { t: 'Acumulado (R$)', k: 'acc', num: true, f: fR }, { t: '% Avanço acum.', k: 'pct', num: true, f: v => pctBar(v) }, { t: 'Saldo contratual (R$)', k: 'saldo', num: true, f: fR }], ev,
    { semSort: true, total: (rs, c, i) => ['TOTAL', fR(TOT.vm), fP(1), '', fP(TOT.pct), fR(TOT.vs)][i] })));
  root.appendChild(el('div', 'kpis', [kpi('Média de medição por BM', fR(TOT.media)), kpi('BMs restantes p/ consumir saldo', fN(+TOT.bmsRest.toFixed(1)), 'no ritmo médio'), kpi('Média dos 3 últimos BMs', fR(TOT.media3)), kpi('BMs p/ concluir (ritmo 3 últ.)', fN(+TOT.bmsConc.toFixed(1)))].join('')));
  root.lastChild.style.marginTop = '18px';
  const comp = (titulo, key, ordem) => { const rows = agg(IT, key); if (ordem) rows.sort((x, y) => ordem.indexOf(x.k) - ordem.indexOf(y.k)); else rows.sort((x, y) => y.pt - x.pt);
    return sec(titulo, 'previsto em contrato × medido × saldo', tabela([{ t: titulo.replace('Comparativo por ', '') }, { t: 'Itens', k: 'n', num: true, f: fN }, { t: 'Previsto (R$)', k: 'pt', num: true, f: fR }, { t: 'Medido (R$)', k: 'vm', num: true, f: fR }, { t: 'Saldo (R$)', k: 'vs', num: true, neg: true, f: fR }, { t: '% Avanço', k: r => r.pt ? r.vm / r.pt : null, num: true, f: v => v === null ? '–' : pctBar(v, v > 1 ? 'crit' : '') }, { t: 'Part. contrato', k: r => r.pt / TOT.ct, num: true, f: v => fP(v) }].map((c, i) => i === 0 ? { ...c, k: 'k', f: v => key === (x => x.emp || '(não classificado)') ? v : h(v) } : c), rows,
      { total: (rs, c, i) => ['TOTAL', fN(sum(rs, r => r.n)), fR(sum(rs, r => r.pt)), fR(sum(rs, r => r.vm)), fR(sum(rs, r => r.vs)), fP(sum(rs, r => r.vm) / sum(rs, r => r.pt)), fP(1)][i] })); };
  root.appendChild(comp('Comparativo por ativo', i => i.ativo));

  root.appendChild(comp('Comparativo por contrato', i => i.contrato || '(não classificado)', ['CT INICIAL', 'TAC 1', 'TAC 2', '(não classificado)']));
  root.appendChild(el('div', 'nota', 'O item 12.1 (Mão de obra e equipamentos sob demanda, SSD) está sem empresa na QQP e é contabilizado como MARKA neste painel; segue sem contrato atribuído, por isso aparece como "(não classificado)" no comparativo por contrato.'));
  root.appendChild(sec('Top 10 itens medidos', '', tabela([COL.descT, COL.item, COL.ativo, COL.emp, COL.vm, { t: '% do medido', k: r => r.vm / TOT.vm, num: true, f: v => fP(v) }], [...IT].sort((x, y) => y.vm - x.vm).slice(0, 10), { clique: abrirItem })));
}

/* ---------- 4. ANÁLISE ATIVOS ---------- */
function vAtivos(root) {

    const max = Math.max(...rows.flatMap(r => r.bm)); const w = el('div', 'tw');
    w.innerHTML = `<table class="heat"><thead><tr><th>${h(titulo)}</th>${BMS.map(b => `<th class="num">${b}</th>`).join('')}<th class="num">TOTAL</th><th class="num">% Part.</th><th class="num">Média 3 últ.</th><th class="num">Saldo</th><th class="num">BMs p/ concluir</th></tr></thead><tbody>` +
      rows.map(r => { const m3 = r.bm.slice(-3).reduce((a, b) => a + b, 0) / 3; const bc = r.vs <= 0 ? '–' : m3 > 0 ? fN(+(r.vs / m3).toFixed(1)) : '–'; return `<tr><td style="white-space:nowrap">${h(trunc(r.k, 36))}</td>${r.bm.map(v => `<td class="h" style="background:${seq(v, max)};color:${v / max > .6 ? '#fff' : 'var(--ink)'}" title="${fR(v)}">${v ? fK(v) : '<span style="color:var(--ink3)">·</span>'}</td>`).join('')}<td class="num"><b>${fK(r.vm)}</b></td><td class="num">${fP(r.vm / TOT.vm)}</td><td class="num">${fK(m3)}</td><td class="${numCls(r.vs)}">${fK(r.vs)}</td><td class="num">${bc}</td></tr>`; }).join('') +
      `</tbody><tfoot><tr><td>TOTAL</td>${BMS.map((b, k) => `<td class="num">${fK(sum(rows, r => r.bm[k]))}</td>`).join('')}<td class="num">${fK(sum(rows, r => r.vm))}</td><td class="num">${fP(sum(rows, r => r.vm) / TOT.vm)}</td><td class="num">${fK(TOT.media3)}</td><td class="num">${fK(sum(rows, r => r.vs))}</td><td class="num">${fN(+TOT.bmsConc.toFixed(1))}</td></tr></tfoot></table>`;
    return sec(titulo === 'Ativo / Frente' ? 'Matriz de evolução · BM × Ativo (R$)' : 'Matriz de evolução · BM × Empresa (R$)', sub, w);
  };
  root.appendChild(heat('Ativo / Frente', agg(IT, i => i.ativo).sort((x, y) => y.vm - x.vm), 'a intensidade do azul segue o valor medido no BM · passe o mouse para ver o valor exato'));

  // Gráfico: medido por BM empilhado por empresa
  const pe = agg(IT, i => i.emp || 'não classificado'); const ec = { MARKA: css('--s-marka'), KLOG: css('--s-klog'), VCA: css('--s-vca'), 'não classificado': css('--ink3') };
  const p = el('div', 'painel', `${legHTML(pe.map(r => [r.k, ec[r.k]]))}<div class="ch"><canvas></canvas></div>`);
  root.appendChild(sec('Medido por BM e empresa', 'R$ no período, empilhado', p));
  chart(p.querySelector('canvas'), { type: 'bar', data: { labels: BMS, datasets: pe.map(r => ({ label: r.k, data: r.bm, backgroundColor: ec[r.k], borderRadius: 3, borderWidth: 1, borderColor: css('--bg') })) }, options: { scales: { x: { stacked: true }, y: { stacked: true } }, plugins: { tooltip: tipR }, datasets: { bar: { barPercentage: .62 } } } });
  // Top 5 por ativo
  const g = el('div', 'grid g2');
  for (const a of agg(IT, i => i.ativo).sort((x, y) => y.vm - x.vm)) { const top = IT.filter(i => i.ativo === a.k).sort((x, y) => y.vm - x.vm).slice(0, 5);
    const pa = el('div', 'painel', `<div class="sec-h"><h2 style="text-transform:none;letter-spacing:0;font-size:12.5px">${h(a.k)}</h2><span class="sub">medido ${fK(a.vm)} · ${a.nMed} de ${a.n} itens com medição</span></div>`);
    pa.appendChild(tabela([{ t: '#', k: (r) => top.indexOf(r) + 1, num: true }, COL.item, { ...COL.descT, f: v => `<span title="${h(v)}">${h(trunc(v, 70))}</span>` }, { t: 'Medido (R$)', k: 'vm', num: true, f: fR0 }, { t: '% do ativo', k: r => r.vm / a.vm, num: true, f: v => pctBar(v) }], top, { semSort: true, clique: abrirItem })); g.appendChild(pa); }
  root.appendChild(sec('Top 5 itens medidos por ativo', '', g));
}

/* ---------- 5. SALDO & ALERTAS ---------- */

    { total: (rs, c, i) => ['TOTAL', fR(TOT.vs), fP(1), fP(TOT.pct), fN(par.length), fN(ni.length), fN(est.length)][i] })));

/* ---------- 6. RELATÓRIO BM ---------- */
function vBM(root) {
  const S = STATE.bm ||= { k: NB - 1 };
  const f = el('div', 'filtros', selectHTML('sel', 'Boletim de medição', BMS, BMS[S.k]) + `<span class="conta">todo o relatório se atualiza com o BM escolhido</span>`);
  const out = el('div'); root.append(f, out);
  f.querySelector('#sel').onchange = e => { S.k = BMS.indexOf(e.target.value); draw(); };
  function draw() {
    destroyCharts(); out.innerHTML = ''; const k = S.k, kp = k > 0 ? k - 1 : null; const per = TOT.porBM[k]; const acc = TOT.porBM.slice(0, k + 1).reduce((a, b) => a + b, 0);
    const delta = kp !== null ? per - TOT.porBM[kp] : null;
    out.appendChild(el('div', 'kpis', [kpi('Medido no ' + BMS[k], fR(per), delta !== null ? `<span style="color:${delta >= 0 ? 'var(--ok)' : 'var(--crit)'}">${delta >= 0 ? '▲' : '▼'} ${fK(Math.abs(delta))} vs ${BMS[kp]}</span>` : '', 'ouro'), kpi('Acumulado até o BM', fR(acc)), kpi('% Avanço acumulado', fP(acc / TOT.ct)), kpi('Saldo após o BM', fR(TOT.ct - acc)), kpi('Participação no medido total', fP(per / TOT.vm))].join('')));
    const pa = agg(IT, i => i.ativo).map(r => ({ k: r.k, v: r.bm[k], ant: kp !== null ? r.bm[kp] : null })).sort((x, y) => y.v - x.v);
    const pe = agg(IT, i => i.emp || '(não classificado)').map(r => ({ k: r.k, v: r.bm[k], ant: kp !== null ? r.bm[kp] : null })).sort((x, y) => y.v - x.v);
    const g = el('div', 'grid g2');
    const t1 = sec('Medição do BM por ativo / frente', '', tabela([{ t: 'Ativo / Frente', k: 'k' }, { t: 'Medido no BM (R$)', k: 'v', num: true, neg: true, f: fR }, { t: '% do BM', k: r => per ? r.v / per : 0, num: true, f: v => pctBar(Math.max(0, v)) }, { t: 'BM anterior (R$)', k: 'ant', num: true, f: v => v === null ? '–' : fR0(v) }], pa, { semSort: true, total: (rs, c, i) => ['TOTAL DO BM', fR(per), fP(1), kp !== null ? fR0(TOT.porBM[kp]) : '–'][i] }));
    const t2 = sec('Medição do BM por empresa', '', tabela([{ t: 'Empresa', k: 'k', f: v => v.startsWith('(') ? h(v) : empTag(v) }, { t: 'Medido no BM (R$)', k: 'v', num: true, neg: true, f: fR }, { t: '% do BM', k: r => per ? r.v / per : 0, num: true, f: v => pctBar(Math.max(0, v)) }, { t: 'BM anterior (R$)', k: 'ant', num: true, f: v => v === null ? '–' : fR0(v) }], pe, { semSort: true, total: (rs, c, i) => ['TOTAL DO BM', fR(per), fP(1), kp !== null ? fR0(TOT.porBM[kp]) : '–'][i] }));
    g.append(t1, t2); out.appendChild(g);
    const top = IT.filter(i => i.bmv[k] !== 0).sort((x, y) => Math.abs(y.bmv[k]) - Math.abs(x.bmv[k])).slice(0, 15);
    out.appendChild(sec(`Top 15 itens do ${BMS[k]}`, `${IT.filter(i => i.bm[k] !== 0).length} itens com medição no boletim`, tabela([{ t: '#', k: r => top.indexOf(r) + 1, num: true }, COL.descT, COL.item, COL.ativo, COL.emp, COL.un, { t: 'Qtd no BM', k: r => r.bm[k], num: true, f: fQ }, { t: 'Medido no BM (R$)', k: r => r.bmv[k], num: true, neg: true, f: fR }, { t: '% do BM', k: r => r.bmv[k] / per, num: true, f: v => fP(v) }, { t: 'Acum. do item', k: r => r.pt ? r.vm / r.pt : null, num: true, f: v => v === null ? '–' : fP(v) }], top, { semSort: true, clique: abrirItem })));
    const novos = IT.filter(i => i.bm[k] !== 0 && i.bm.slice(0, k).every(q => q === 0));
    if (novos.length) out.appendChild(sec(`Itens iniciados neste BM`, `${novos.length} itens com primeira medição no ${BMS[k]}`, tabela([COL.item, COL.descT, COL.ativo, COL.emp, { t: 'Medido no BM (R$)', k: r => r.bmv[k], num: true, f: fR }, { t: 'Preço total (R$)', k: 'pt', num: true, f: fR }], novos.sort((x, y) => y.bmv[k] - x.bmv[k]), { clique: abrirItem })));
  }
  draw();
}

/* ---------- 7. EVOLUÇÃO CBUQ & C40 ---------- */
function vCBUQ(root) {

  const f = el('div', 'filtros', `<label>Série 1 · descrição contém<input type="text" id="a" value="${h(S.a)}"></label><label>Unidade<input type="text" id="au" value="${h(S.au)}" style="min-width:70px;max-width:90px"></label>
    <label>Série 2 · descrição contém (use | para alternativas)<input type="text" id="b" value="${h(S.b)}"></label><label>Unidade<input type="text" id="bu" value="${h(S.bu)}" style="min-width:70px;max-width:90px"></label><button class="btn pri" id="ok">Aplicar</button>`);
  const out = el('div'); root.append(f, out);
  f.querySelector('#ok').onclick = () => { S.a = f.querySelector('#a').value; S.au = f.querySelector('#au').value; S.b = f.querySelector('#b').value; S.bu = f.querySelector('#bu').value; draw(); };
  const norm = s => s.toLowerCase().replace('3', '³').replace('2', '²').trim();
  function serie(txt, un) { const alts = txt.split('|').map(s => s.trim().toLowerCase()).filter(Boolean); return IT.filter(i => alts.some(a => i.desc.toLowerCase().includes(a)) && (!un.trim() || norm(i.un) === norm(un))); }

    const linha = (L) => { let qa = 0, va = 0; return BMS.map((b, k) => { const q = sum(L, i => i.bm[k]), v = sum(L, i => i.bmv[k]); qa += q; va += v; return { bm: b, q, v, qa, va }; }); };
    const la = linha(A), lb = linha(B);
    out.appendChild(el('div', 'kpis', [kpi(`${S.a} acumulado`, `${fQ(la[NB - 1].qa)} ${S.au}`, fR0(la[NB - 1].va) + ` · ${A.length} itens`), kpi(`${S.b.split('|')[0]} acumulado`, `${fQ(lb[NB - 1].qa)} ${S.bu}`, fR0(lb[NB - 1].va) + ` · ${B.length} itens`, 'ouro'), kpi('Contratado série 1', `${fQ(sum(A, i => i.qtd))} ${S.au}`, `medido ${fP(sum(A, i => i.qm) / (sum(A, i => i.qtd) || 1))}`), kpi('Contratado série 2', `${fQ(sum(B, i => i.qtd))} ${S.bu}`, `medido ${fP(sum(B, i => i.qm) / (sum(B, i => i.qtd) || 1))}`)].join('')));
    const g = el('div', 'grid g2');
    const p1 = el('div', 'painel', `<div class="sec-h"><h2>${h(S.a)} · quantidade por BM (${h(S.au)})</h2></div><div class="ch"><canvas></canvas></div>`);
    const p2 = el('div', 'painel', `<div class="sec-h"><h2>${h(S.b.split('|')[0])} · quantidade por BM (${h(S.bu)})</h2></div><div class="ch"><canvas></canvas></div>`);
    g.append(p1, p2); out.appendChild(sec('Produção mês a mês', 'um gráfico por série, mesma escala de tempo', g));
    const qt = { callbacks: { label: c => ` ${fQ(c.parsed.y)}` } };
    chart(p1.querySelector('canvas'), { type: 'bar', data: { labels: BMS, datasets: [{ data: la.map(x => x.q), backgroundColor: css('--azul'), borderRadius: 4, barPercentage: .6 }] }, options: { scales: { y: { ticks: { callback: v => fQ(v) } } }, plugins: { tooltip: qt } } });
    chart(p2.querySelector('canvas'), { type: 'bar', data: { labels: BMS, datasets: [{ data: lb.map(x => x.q), backgroundColor: css('--ouro'), borderRadius: 4, barPercentage: .6 }] }, options: { scales: { y: { ticks: { callback: v => fQ(v) } } }, plugins: { tooltip: qt } } });
    const w = el('div', 'tw'); w.innerHTML = `<table><thead><tr><th rowspan="2">Período</th><th colspan="4" style="text-align:center;border-left:1px solid rgba(255,255,255,.3)">${h(S.a)} (${h(S.au)})</th><th colspan="4" style="text-align:center;border-left:1px solid rgba(255,255,255,.3)">${h(S.b.split('|')[0])} (${h(S.bu)})</th><th rowspan="2" class="num">Total R$ no BM</th></tr><tr><th class="num">Qtd no BM</th><th class="num">R$ no BM</th><th class="num">Qtd acum.</th><th class="num">R$ acum.</th><th class="num">Qtd no BM</th><th class="num">R$ no BM</th><th class="num">Qtd acum.</th><th class="num">R$ acum.</th></tr></thead><tbody>` +
      BMS.map((b, k) => `<tr><td>${b}</td><td class="num">${fQ(la[k].q)}</td><td class="num">${fR0(la[k].v)}</td><td class="num">${fQ(la[k].qa)}</td><td class="num">${fR0(la[k].va)}</td><td class="num">${fQ(lb[k].q)}</td><td class="num">${fR0(lb[k].v)}</td><td class="num">${fQ(lb[k].qa)}</td><td class="num">${fR0(lb[k].va)}</td><td class="num">${fR0(la[k].v + lb[k].v)}</td></tr>`).join('') +
      `</tbody><tfoot><tr><td>TOTAL</td><td class="num">${fQ(la[NB - 1].qa)}</td><td class="num">${fR0(la[NB - 1].va)}</td><td></td><td></td><td class="num">${fQ(lb[NB - 1].qa)}</td><td class="num">${fR0(lb[NB - 1].va)}</td><td></td><td></td><td class="num">${fR0(la[NB - 1].va + lb[NB - 1].va)}</td></tr></tfoot></table>`;
    out.appendChild(sec('Tabela mês a mês', '', w));
    out.appendChild(sec('Itens considerados', '', tabela([COL.item, COL.descT, COL.ativo, COL.un, COL.qtd, COL.qm, COL.pct, COL.vm], [...A, ...B], { clique: abrirItem })));

      chart(p.querySelector('canvas'), { type: 'bar', data: { labels: e15.map(i => `${i.item} · ${trunc(i.desc, 40)}`), datasets: [{ label: 'Prevista', data: e15.map(i => i.qtd), backgroundColor: css('--azul-claro'), borderRadius: 3 }, { label: 'Medida', data: e15.map(i => i.qm), backgroundColor: css('--crit'), borderRadius: 3 }] }, options: { indexAxis: 'y', scales: { x: { type: 'logarithmic', grid: { color: css('--linha2') }, ticks: { callback: v => { const m = v / Math.pow(10, Math.floor(Math.log10(v))); return [1, 2, 5].some(x => Math.abs(m - x) < 1e-9) ? fQ(v) : ''; } } }, y: { grid: { display: false }, ticks: { autoSkip: false, font: { size: 10 }, callback: function (v) { return this.getLabelForValue(v); } } } }, plugins: { tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${fQ(c.parsed.x)} ${e15[c.dataIndex].un}` } } }, datasets: { bar: { barPercentage: .8, categoryPercentage: .7 } } } });
      out.appendChild(el('div', 'nota', 'Eixo em escala logarítmica para caber itens de 20 m³ e de 60.000 kg no mesmo gráfico; passe o mouse para ver os valores.')); }
    out.appendChild(sec('3. Detalhe dos itens estourados', '', tabela([COL.item, COL.descT, COL.emp, COL.un, { t: 'Qtd prevista', k: 'qtd', num: true, f: fQ }, { t: 'Qtd medida', k: 'qm', num: true, f: fQ }, { t: 'Desvio qtd', k: r => r.qm - r.qtd, num: true, f: fQ }, { t: 'Desvio %', k: r => r.qtd ? (r.qm - r.qtd) / r.qtd : null, num: true, f: v => v === null ? '–' : `<span style="color:var(--crit);font-weight:700">+${fP(v, 0)}</span>` }, COL.pu, { t: 'Desvio (R$)', k: r => -r.vs, num: true, f: fR }], est, { clique: abrirItem, total: (rs, c, i) => i === 0 ? 'TOTAL' : i === 9 ? fR(sum(rs, r => -r.vs)) : '' })));
    out.appendChild(sec('4. Comparativo por item (R$)', 'todos os itens medidos do recorte', tabela([COL.item, COL.descT, COL.emp, COL.un, COL.qtd, COL.qm, { t: 'Previsto (R$)', k: 'pt', num: true, f: fR }, { t: 'Medido (R$)', k: 'vm', num: true, f: fR }, { t: 'Desvio (R$)', k: r => r.vm - r.pt, num: true, f: v => `<span style="color:${v > 0.005 ? 'var(--crit)' : v < -0.005 ? 'var(--ok)' : 'inherit'}">${fR(v)}</span>` }, { t: 'Desvio %', k: r => r.pt ? (r.vm - r.pt) / r.pt : null, num: true, f: v => v === null ? '–' : fP(v, 0) }], L, { alto: true, clique: abrirItem, sort: 8, total: (rs, c, i) => ['TOTAL', '', '', '', '', '', fR(t.pt), fR(t.vm), fR(t.vm - t.pt), fP(t.vm / t.pt - 1)][i] })));
  }
  bind();
}

/* ---------- 10. ESTUDOS DE PROJEÇÃO (Adm Local + Transporte, generalizado) ---------- */
function vEstudo(root) {
  const PRESETS = [{ n: 'Administração Local TAC-02 (1.2.3.1.1)', itens: ['1.2.3.1.1'] }, { n: 'Transporte coletivo (1.2.3.2.1 + 1.2.3.2.2)', itens: ['1.2.3.2.1', '1.2.3.2.2'] }, { n: 'Manutenção de canteiro central (1.2.2.1.1)', itens: ['1.2.2.1.1'] }, { n: 'Outro item (digite os códigos)', itens: [] }];
  const S = STATE.est ||= { p: 0, custom: '', ritmo: '3', rv: 0, fim: 24 };
  const f = el('div', 'filtros'); const out = el('div'); root.append(f, out);
  function bind() {
    f.innerHTML = `<label>Estudo<select id="p">${PRESETS.map((p, i) => `<option value="${i}" ${S.p === i ? 'selected' : ''}>${h(p.n)}</option>`).join('')}</select></label>
      ${S.p === 3 ? `<label>Códigos de item (separe por +)<input type="text" id="custom" value="${h(S.custom)}" placeholder="ex.: 1.2.2.2 + 1.2.2.1.1"></label>` : ''}
      <label>Ritmo da projeção<select id="ritmo"><option value="3" ${S.ritmo === '3' ? 'selected' : ''}>Média dos 3 últimos BMs</option><option value="5" ${S.ritmo === '5' ? 'selected' : ''}>Média dos 5 últimos BMs</option><option value="m" ${S.ritmo === 'm' ? 'selected' : ''}>Valor manual (R$/BM)</option></select></label>
      ${S.ritmo === 'm' ? `<label>R$ por BM<input type="number" id="rv" value="${S.rv}" step="1000"></label>` : ''}
      <label>Último BM do contrato<input type="number" id="fim" value="${S.fim}" min="${NB}" max="60"></label><button class="btn pri" id="ok">Recalcular</button>`;
    f.querySelector('#p').onchange = e => { S.p = +e.target.value; bind(); }; f.querySelector('#ritmo').onchange = e => { S.ritmo = e.target.value; bind(); };
    f.querySelector('#ok').onclick = () => { if (S.p === 3) S.custom = f.querySelector('#custom').value; if (S.ritmo === 'm') S.rv = +f.querySelector('#rv').value; S.fim = +f.querySelector('#fim').value; draw(); };
    draw();
  }
  function draw() {
    destroyCharts(); out.innerHTML = '';
    const cods = S.p === 3 ? S.custom.split('+').map(s => s.trim()).filter(Boolean) : PRESETS[S.p].itens;
    const L = IT.filter(i => cods.includes(i.item)); if (!L.length) { out.appendChild(el('div', 'painel', 'Nenhum item encontrado para os códigos informados.')); return; }
    const t = tot(L); const inteiros = BMS.map((b, k) => ({ b, k })).filter(x => !x.b.includes('.')); // sem BMs complementares .1
    const real = inteiros.map(x => ({ bm: x.b, v: sum(L, i => i.bmv[x.k]), q: sum(L, i => i.bm[x.k]) }));
    const ult = n => { const l = real.slice(-n); return sum(l, r => r.v) / n; }; const m3 = ult(3), m5 = ult(5);
    const ritmo = S.ritmo === '3' ? m3 : S.ritmo === '5' ? m5 : S.rv;
    const puMed = sum(L, i => i.pt) / (sum(L, i => i.qtd) || 1);
    // linha do tempo
    const rows = []; let acc = 0, saldo = t.pt; real.forEach(r => { acc += r.v; saldo -= r.v; rows.push({ ...r, acc, saldo, sit: 'REALIZADO' }); });
    const nReal = real.length; let bmEsgota = null;
    for (let n = nReal + 1; n <= Math.max(S.fim, nReal); n++) { const bm = 'BM' + String(n).padStart(2, '0'); if (saldo <= 0.005 || ritmo <= 0) { rows.push({ bm, v: 0, q: 0, acc, saldo: Math.max(0, saldo), sit: ritmo <= 0 ? 'SEM RITMO' : 'ESGOTADO' }); continue; }
      const v = Math.min(ritmo, saldo); const parcial = v < ritmo - 0.005; acc += v; saldo -= v; rows.push({ bm, v, q: v / puMed, acc, saldo, sit: parcial ? 'PARCIAL' : 'PROJEÇÃO' }); if (saldo <= 0.005 && !bmEsgota) bmEsgota = bm; }
    const bmsInteiros = ritmo > 0 ? Math.floor(t.vs / ritmo) : 0;
    const restantes = S.fim - nReal; const necessidade = ritmo * restantes; const aditivo = Math.max(0, necessidade - t.vs);
    out.appendChild(el('div', 'kpis', [kpi('Preço total dos itens', fR(t.pt), `${L.length} item(ns) · PU médio ${fR(puMed)}`), kpi(`Medido até ${real[nReal - 1].bm}`, fR(t.vm), fP(t.vm / t.pt) + ' do total', 'ouro'), kpi('Saldo atual', fR(t.vs), '', t.vs < 0 ? 'crit' : ''), kpi('Ritmo adotado', fR0(ritmo) + '/BM', `3 últ. ${fK(m3)} · 5 últ. ${fK(m5)}`), kpi('Saldo esgota em', bmEsgota || (t.vs <= 0 ? 'já esgotado' : `após BM${S.fim}`), bmsInteiros ? `dá para mais ${bmsInteiros} BM(s) integral(is)` : '', bmEsgota && +bmEsgota.slice(2) < S.fim ? 'warn' : 'ok')].join('')));
    const p = el('div', 'painel', `${legHTML([['Realizado', css('--azul')], ['Projeção', css('--azul-claro')], ['Parcial / esgotado', css('--warn')]])}<div class="ch"><canvas></canvas></div>`);
    out.appendChild(sec('Linha do tempo · realizado + projeção', 'sem os BMs complementares (.1)', p));
    chart(p.querySelector('canvas'), { type: 'bar', data: { labels: rows.map(r => r.bm), datasets: [{ data: rows.map(r => r.v), backgroundColor: rows.map(r => r.sit === 'REALIZADO' ? css('--azul') : r.sit === 'PROJEÇÃO' ? css('--azul-claro') : css('--warn')), borderRadius: 4, barPercentage: .6 }] }, options: { plugins: { tooltip: { callbacks: { label: c => ` ${fR0(c.parsed.y)} · ${rows[c.dataIndex].sit}` } } } } });
    const sitTag = s => `<span class="tag ${s === 'REALIZADO' ? 'A' : s === 'PROJEÇÃO' ? 'B' : s === 'PARCIAL' ? 'warn' : 'neu'}">${s}</span>`;
    out.appendChild(sec('Tabela da linha do tempo', '', tabela([{ t: 'BM', k: 'bm' }, { t: 'Medido no BM (R$)', k: 'v', num: true, f: fR }, { t: 'Saldo após o BM (R$)', k: 'saldo', num: true, neg: true, f: fR }, { t: 'Acumulado (R$)', k: 'acc', num: true, f: fR }, { t: `Qtd no BM (${h(L[0].un)})`, k: 'q', num: true, f: v => fQ(v) }, { t: 'Situação', k: 'sit', f: sitTag }], rows.map(r => ({ ...r, _cls: '' })), { semSort: true })));
    const w = el('div', 'painel'); w.innerHTML = `<div class="sec-h"><h2>Estudo de aditivo · manter o ritmo até o BM${S.fim}</h2></div><dl class="dl" style="grid-template-columns:320px 1fr">
      <dt>Último BM medido</dt><dd>${real[nReal - 1].bm}</dd><dt>Último BM do contrato</dt><dd>BM${S.fim}</dd><dt>BMs restantes a medir</dt><dd>${restantes}</dd><dt>Ritmo mensal adotado</dt><dd>${fR(ritmo)}</dd>
      <dt>Necessidade total (${restantes} BMs)</dt><dd>${fR(necessidade)}</dd><dt>(−) Saldo atual disponível</dt><dd>${fR(t.vs)}</dd><dt><b>Aditivo necessário</b></dt><dd><b style="color:${aditivo > 0 ? 'var(--crit)' : 'var(--ok)'}">${fR(aditivo)}</b></dd>
      <dt>Quantidade a aditivar</dt><dd>${fQ(aditivo / puMed)} ${h(L[0].un)}</dd><dt>% de acréscimo sobre o contratado</dt><dd>${fP(aditivo / t.pt)}</dd><dt>Novo valor total com aditivo</dt><dd>${fR(t.pt + aditivo)}</dd></dl>
      <div class="nota">Aditivo calculado como necessidade (ritmo × BMs restantes) menos o saldo atual. Alçada de aprovação e cláusula de acréscimo (Lei 14.133/21, art. 125, até 25% para obras) devem ser conferidas antes do pleito.</div>`;
    out.appendChild(w);
  }
  bind();
}

/* ---------- 11. K-LOG ---------- */
function vKlog(root) {
  const L = IT.filter(i => i.emp === 'KLOG'); const t = tot(L);
  root.appendChild(el('div', 'kpis', [kpi('Valor contratado K-Log', fR(t.pt), `${L.length} itens · ${fP(t.pt / TOT.ct)} do contrato`), kpi('Valor medido', fR(t.vm), fP(t.vm / t.pt) + ' do contratado', 'ouro'), kpi('Saldo', fR(t.vs)), kpi('Itens com medição', `${L.filter(i => i.qm !== 0).length} de ${L.length}`), kpi('Média 3 últimos BMs', fR0(sum(L, i => i.l3) / 3), 'por BM')].join('')));
  const p = el('div', 'painel', `<div class="sec-h"><h2>Medido K-Log por BM</h2></div><div class="ch"><canvas></canvas></div>`);
  root.appendChild(sec('Evolução', '', p)); chart(p.querySelector('canvas'), { type: 'bar', data: { labels: BMS, datasets: [{ data: BMS.map((b, k) => sum(L, i => i.bmv[k])), backgroundColor: css('--s-klog'), borderRadius: 4, barPercentage: .6 }] }, options: { plugins: { tooltip: tipR } } });
  const pa = agg(L, i => i.ativo).sort((x, y) => y.pt - x.pt);
  root.appendChild(sec('Por ativo', '', tabela([{ t: 'Ativo', k: 'k' }, { t: 'Itens', k: 'n', num: true, f: fN }, { t: 'Contratado (R$)', k: 'pt', num: true, f: fR }, { t: 'Medido (R$)', k: 'vm', num: true, f: fR }, { t: 'Saldo (R$)', k: 'vs', num: true, neg: true, f: fR }, { t: '% Medido', k: r => r.vm / r.pt, num: true, f: v => pctBar(v, v > 1 ? 'crit' : '') }], pa, { semSort: true, total: (rs, c, i) => ['TOTAL K-LOG', fN(L.length), fR(t.pt), fR(t.vm), fR(t.vs), fP(t.vm / t.pt)][i] })));
  root.appendChild(sec('Itens K-Log na QQP', 'vínculo por EMPRESA = KLOG', tabela([COL.ativo, COL.item, COL.desc, COL.un, COL.pu, { t: 'Qtd contratada', k: 'qtd', num: true, f: fQ }, { t: 'Valor contratado (R$)', k: 'pt', num: true, f: fR }, COL.qm, COL.vm, COL.qs, COL.vs, COL.pct, COL.status], L, { clique: abrirItem, total: (rs, c, i) => ['TOTAL K-LOG', '', '', '', '', '', fR(t.pt), fQ(sum(rs, r => r.qm)), fR(t.vm), '', fR(t.vs), fP(t.vm / t.pt), ''][i] })));
}

/* ---------- ANÁLISES · quatro formas de leitura ---------- */
function vAnalises(root) {
  const S = STATE.anal ||= { a: Math.max(0, NB - 5), b: NB - 1, dim: 'ativo' };
  const dims = { ativo: ['Ativo / Frente', i => i.ativo], emp: ['Empresa', i => i.emp], contrato: ['Contrato', i => i.contrato] };
  const f = el('div', 'filtros'); const out = el('div'); root.append(f, out);
  function bind() {
    f.innerHTML = `<label>Agrupar por<span class="sel-lin">${Object.entries(dims).map(([k, v]) => `<button class="${S.dim === k ? 'on' : ''}" data-d="${k}">${v[0]}</button>`).join('')}</span></label>
      ${selectHTML('a', 'Comparar de', BMS, BMS[S.a])}${selectHTML('b', 'até', BMS, BMS[S.b])}
      <span class="conta">os dois BMs valem para o gráfico de inclinação</span>`;
    f.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { S.dim = b.dataset.d; bind(); });
    f.querySelector('#a').onchange = e => { S.a = BMS.indexOf(e.target.value); draw(); };
    f.querySelector('#b').onchange = e => { S.b = BMS.indexOf(e.target.value); draw(); };
    draw();
  }
  function draw() {
    destroyCharts(); out.innerHTML = '';
    const [rotDim, keyFn] = dims[S.dim];
    const grupos = agg(IT, keyFn).sort((x, y) => y.vm - x.vm);
    const top = grupos.slice(0, 6);

    // 1. BUMP
    const b1 = blocoGrafico('Ranking de medição por BM',
      `cada linha é um ${rotDim.toLowerCase()}; quanto mais alto, maior foi a medição naquele boletim. Cruzamento de linhas significa troca de posição.`,
      'para ver quem puxa a medição em cada boletim e quando a liderança muda de frente. Mostra ordem, não tamanho: use junto com a matriz da aba Análise Ativos.');
    out.appendChild(sec('1 · Bump chart', `os ${top.length} maiores por valor medido acumulado`, b1));
    bumpChart(b1.querySelector('canvas'), top.map(g => ({ nome: trunc(g.k, 28), v: g.bm })), BMS.map(b => b.replace('BM', '')));
    out.appendChild(el('div', 'leg', top.map((g, i) => `<span><i style="background:${corCat(i)}"></i>${h(trunc(g.k, 30))}</span>`).join('')));

    // 2. SLOPE
    const ka = S.a, kb = S.b;
    const acumAte = (g, k) => g.bm.slice(0, k + 1).reduce((a, b) => a + b, 0);
    const linhas = grupos.filter(g => g.pt > 0).map(g => ({ nome: trunc(g.k, 26), a: acumAte(g, ka) / g.pt, b: acumAte(g, kb) / g.pt })).sort((x, y) => y.b - x.b).slice(0, 8);
    const b2 = blocoGrafico(`Avanço de ${BMS[ka]} para ${BMS[kb]}`,
      'cada linha liga o avanço acumulado da frente nos dois boletins. Linha inclinada para cima ganhou avanço no período; linha quase plana ficou parada.',
      'para comparar o ritmo entre frentes em dois momentos, sem a poluição de uma série mês a mês. Bom para reunião de acompanhamento.');
    out.appendChild(sec('2 · Slope chart', 'avanço acumulado, em % do previsto de cada frente', b2));
    slopeChart(b2.querySelector('canvas'), linhas, BMS[ka], BMS[kb], { fmt: v => fP(v, 0) });
    out.appendChild(sec('', '', tabela([
      { t: rotDim, k: 'nome' }, { t: `Avanço em ${BMS[ka]}`, k: 'a', num: true, f: v => fP(v) }, { t: `Avanço em ${BMS[kb]}`, k: 'b', num: true, f: v => fP(v) },
      { t: 'Ganho no período', k: r => r.b - r.a, num: true, f: v => `<span style="color:${v > 0.0005 ? 'var(--ok)' : 'var(--ink3)'}">${v > 0 ? '+' : ''}${fP(v)}</span>` },
    ], linhas, { semSort: true })));

    // 3. CASCATA
    const outras = grupos.slice(6);
    const passos = [{ nome: 'Contrato', v: TOT.ct, tipo: 'inicio' },
      ...top.map(g => ({ nome: trunc(g.k, 18), v: -g.vm, nota: `${fP(g.vm / g.pt)} da frente` })),
      ...(outras.length ? [{ nome: `Outras (${outras.length})`, v: -sum(outras, g => g.vm) }] : []),
      { nome: 'Saldo', v: 0, tipo: 'total' }];
    const b3 = blocoGrafico('Do contrato ao saldo',
      'a barra azul da esquerda é o valor contratual; cada barra laranja é o quanto uma frente já consumiu; a barra azul da direita é o saldo que sobra.',
      'para mostrar à diretoria de onde saiu o saldo, e não só quanto ele é. Funciona em qualquer decomposição de um total em partes.');
    out.appendChild(sec('3 · Cascata', 'medição acumulada por frente até o saldo atual', b3));
    cascataChart(b3.querySelector('canvas'), passos, { fmt: fK });

    // 4. HISTOGRAMA
    const itens = IT.filter(i => i.pt > 0);
    const pct = itens.map(i => Math.min(2, Math.max(0, i.vm / i.pt)));
    const zerados = itens.filter(i => i.qm === 0).length, acima = itens.filter(i => i.vm / i.pt > 1.0001).length;
    const b4 = blocoGrafico('Distribuição do avanço dos itens',
      'cada barra conta quantos itens da QQP estão naquela faixa de avanço; a linha dourada é a densidade, que suaviza o desenho e mostra onde a massa se concentra.',
      'para enxergar o perfil da carteira de itens de uma vez: quantos nem começaram, quantos estão no meio do caminho e quantos passaram do contratado.');
    out.appendChild(sec('4 · Histograma com densidade', `${fN(itens.length)} itens com preço contratado`, b4));
    histogramaDensidade(b4.querySelector('canvas'), pct, { min: 0, max: 2, bins: 20, eixoX: '% medido do item (limitado a 200%)', rotulo: 'avanço', fmt: v => fP(v, 0) });
    out.appendChild(el('div', 'dica', `<b>O que a distribuição mostra.</b> ${fN(zerados)} itens (${fP(zerados / itens.length)}) ainda não tiveram nenhuma medição, o que forma a barra alta em 0%. Outros ${fN(acima)} passaram de 100% do contratado e aparecem à direita da linha, somando ${fR0(sum(IT.filter(i => i.estouro), i => -i.vs))} de estouro. O miolo do gráfico é a carteira em execução.`));
  }
  bind();
}
