function bumpChart(canvas, series, labels, opt = {}) {

  for (const p of passos) {
    if (p.tipo === 'inicio' || p.tipo === 'total') { const base = p.tipo === 'inicio' ? 0 : 0; const topo = p.tipo === 'inicio' ? p.v : acum;
      flut.push([base, p.tipo === 'inicio' ? p.v : acum]); valores.push(p.tipo === 'inicio' ? p.v : acum);
      cores.push(css('--azul-esc')); if (p.tipo === 'inicio') acum = p.v; }
    else { const ini = acum; acum += p.v; flut.push([Math.min(ini, acum), Math.max(ini, acum)]); valores.push(p.v);
      cores.push(p.v >= 0 ? css('--ok') : css('--c2')); }
  }
  return chart(canvas, { type: 'bar', data: { labels: passos.map(p => p.nome), datasets: [{ data: flut, backgroundColor: cores, borderRadius: 4, barPercentage: .7 }] },

        return p.tipo === 'delta' ? ` ${p.v >= 0 ? 'entra' : 'sai'} ${fmt(Math.abs(p.v))}` : ` ${fmt(valores[c.dataIndex])}`; },
        afterLabel: c => passos[c.dataIndex].nota || '' } } } } });
}

/* ---------- 4. HISTOGRAMA COM DENSIDADE ---------- */
function kde(dados, grade, banda) {
  // núcleo gaussiano; banda por regra de Silverman se não informada
  const n = dados.length; if (!n) return grade.map(() => 0);
  const media = sum(dados) / n;
  const dp = Math.sqrt(sum(dados.map(x => (x - media) ** 2)) / n) || 1;
  const ord = [...dados].sort((a, b) => a - b);
  const q = p => ord[Math.min(n - 1, Math.max(0, Math.floor(p * (n - 1))))];
  const iqr = q(.75) - q(.25);
  const bw = banda || 0.9 * Math.min(dp, iqr / 1.349 || dp) * Math.pow(n, -0.2) || dp / 3;
  return grade.map(x => sum(dados.map(d => Math.exp(-0.5 * ((x - d) / bw) ** 2))) / (n * bw * Math.sqrt(2 * Math.PI)));
}
function histogramaDensidade(canvas, dados, opt = {}) {
  const nbins = opt.bins || Math.max(8, Math.min(24, Math.ceil(Math.sqrt(dados.length))));
  const min = opt.min !== undefined ? opt.min : Math.min(...dados);
  const max = opt.max !== undefined ? opt.max : Math.max(...dados);
  const larg = (max - min) / nbins || 1;
  const centros = [], contagem = new Array(nbins).fill(0);
  for (let i = 0; i < nbins; i++) centros.push(min + larg * (i + .5));
  for (const d of dados) { let i = Math.floor((d - min) / larg); if (i >= nbins) i = nbins - 1; if (i < 0) i = 0; contagem[i]++; }
  // densidade na mesma unidade da contagem: dens × n × largura do bin
  const dens = kde(dados, centros, opt.banda).map(v => v * dados.length * larg);
  const fmt = opt.fmt || (v => v.toLocaleString('pt-BR', { maximumFractionDigits: 1 }));
  return chart(canvas, { data: { labels: centros.map(c => fmt(c)), datasets: [
      { type: 'bar', label: 'Itens no intervalo', data: contagem, backgroundColor: css('--azul-claro'), borderRadius: 3, barPercentage: 1, categoryPercentage: .92, order: 2 },
      { type: 'line', label: 'Densidade', data: dens, borderColor: css('--ouro'), backgroundColor: 'transparent', borderWidth: 2.5, pointRadius: 0, tension: .35, order: 1 }] },
    options: { scales: { x: { ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 10, font: { size: 10 } }, title: { display: !!opt.eixoX, text: opt.eixoX || '', color: css('--ink3') } },
        y: { title: { display: true, text: 'nº de ocorrências', color: css('--ink3') } } },
      plugins: { tooltip: { callbacks: {
        title: c => `${opt.rotulo || 'faixa'} ≈ ${c[0].label}`,
        label: c => c.dataset.type === 'bar' ? ` ${c.parsed.y} ocorrência(s)` : ` densidade ${c.parsed.y.toLocaleString('pt-BR', { maximumFractionDigits: 1 })}` } } } } });
}

      'para ver qual conta puxa o custo em cada mês e quando essa liderança muda. Mostra ordem, não tamanho: leia junto com a aba Mês a Mês.');

    const b2 = blocoGrafico(`Custo por grupo de ${MA[S.a]} para ${MA[S.b]}`,
      'cada linha liga o custo do grupo nos dois meses. Linha subindo é grupo que cresceu; linha descendo é grupo que recuou.',
      'para comparar a composição do custo em dois momentos sem a poluição da série cheia. Bom para justificar variação de margem.');
    out.appendChild(sec('2 · Slope chart', 'custo mensal por grupo, em reais', b2));
    slopeChart(b2.querySelector('canvas'), linhas, MA[S.a], MA[S.b], { fmt: fK });
    out.appendChild(sec('', '', tabela([
      { t: 'Grupo', k: 'nome' }, { t: MA[S.a], k: 'a', num: true, f: v => fR0(v) }, { t: MA[S.b], k: 'b', num: true, f: v => fR0(v) },
      { t: 'Variação', k: r => r.b - r.a, num: true, f: v => `<span style="color:${v > 0 ? 'var(--crit)' : 'var(--ok)'}">${v > 0 ? '+' : '-'}${fR0(Math.abs(v))}</span>` },
      { t: '%', k: r => r.a > 0 ? (r.b - r.a) / r.a : null, num: true, f: v => v === null ? '–' : fP(v, 0) },
    ], linhas, { semSort: true })));

    // 3. CASCATA
    const gord = [...GRUPOS].sort((x, y) => y.tot - x.tot);
    const passos = [{ nome: 'Receita bruta', v: T.rec, tipo: 'inicio' },
      { nome: 'ISS', v: T.iss, nota: fP(Math.abs(T.iss) / T.rec) + ' da receita' },
      ...gord.map(g => ({ nome: trunc(g.nome, 18), v: -g.tot, nota: `${fP(g.tot / T.custo)} do custo` })),
      { nome: T.lucro >= 0 ? 'Lucro' : 'Prejuízo', v: 0, tipo: 'total' }];

      'para mostrar à diretoria por onde o resultado foi construído, e não só quanto ele é. É a leitura mais direta de uma DRE.');

    out.appendChild(el('div', 'dica', `<b>Leitura.</b> Receita bruta de ${fR0(T.rec)} menos ISS de ${fR0(Math.abs(T.iss))} e custo de ${fR0(T.custo)} resulta em ${fR0(T.lucro)}, margem de ${fP(T.margem)} sobre a receita bruta.`));

    // 4. HISTOGRAMA

      'cada barra conta quantos lançamentos conta × mês caíram naquela faixa de valor; a linha dourada é a densidade, que suaviza o desenho e mostra onde a massa se concentra.',
      'para separar o custo de rotina, que é a maioria dos lançamentos, dos poucos lançamentos grandes que decidem o mês. Serve de base para definir alçada de conferência.');
    out.appendChild(sec('4 · Histograma com densidade', `${fN(vals.length)} lançamentos conta × mês com valor`, b4));

    const grandes = vals.filter(v => v > p95).length, somaGr = sum(vals.filter(v => v > p95));

  }
  bind();
}

}

    out.appendChild(sec('Fornecedores', `${rows.length} de ${FOR.length} fornecedores · valores por mês`, tabela([
      { t: 'Fornecedor', k: 'nome', cls: 'desc', f: v => h(trunc(v, 48)) }, { t: 'Categoria', k: 'cat' },
      ...MM.map((m, i) => ({ t: m, k: r => r.v[i], num: true, f: (v, r) => v ? `<span title="${r.lanc[i]} lançamentos">${fK(v)}</span>` : '<span style="color:var(--ink3)">·</span>' })),
      { t: 'Total 4 meses (R$)', k: 'tot', num: true, f: fR0 },
      { t: `% de ${MM[k]}`, k: r => totMes ? r.v[k] / totMes : 0, num: true, f: v => pctBar(v) },
      { t: 'Var vs mês anterior', k: r => (kp === null || !r.v[kp]) ? null : r.v[k] / r.v[kp] - 1, num: true, f: (v, r) => v === null ? (r.v[k] > 0 ? '<span class="tag A">NOVO</span>' : '–') : cor(-v, (v >= 0 ? '+' : '') + fP(v, 0)) },
      { t: 'Lanç. no mês', k: r => r.lanc[k], num: true, f: fN },
    ], rows, { alto: true, sort: 2 + k, total: (rs, c, i) => { if (i === 0) return 'TOTAL'; if (c.k === 'tot') return fR0(sum(rs, r => r.tot)); const j = MM.indexOf(c.t); if (j >= 0) return fK(sum(rs, r => r.v[j])); if (c.t === 'Lanç. no mês') return fN(sum(rs, r => r.lanc[k])); return ''; } })));
    out.appendChild(sec('Categorias de material', 'os mesmos quatro meses, agrupados', tabela([
      { t: 'Categoria', k: 'nome' }, ...MM.map((m, i) => ({ t: m, k: r => r.v[i], num: true, f: v => v ? fK(v) : '<span style="color:var(--ink3)">·</span>' })),
      { t: 'Total (R$)', k: 'tot', num: true, f: fR0 }, { t: `% de ${MM[k]}`, k: r => totMes ? r.v[k] / totMes : 0, num: true, f: v => pctBar(v) },
    ], CAT.filter(c => c.tot > 0), { sort: 2 + k, total: (rs, c, i) => { if (i === 0) return 'TOTAL'; const j = MM.indexOf(c.t); if (j >= 0) return fK(sum(rs, r => r.v[j])); if (c.k === 'tot') return fR0(sum(rs, r => r.tot)); return ''; } })));
    const prev = MS.find(x => x.mes.includes('previsto'));
    if (prev) out.appendChild(el('div', 'nota', `${h(prev.mes)} é mês não fechado: o valor de ${fR0(prev.total)} vem do analítico de apropriações do SIENGE (contas 2.07.09 e 2.07.28), com ${prev.lanc} lançamentos, e ainda não passou pelo fechamento do DRE. Os demais grupos de custo desse mês seguem em aberto.`));
  }
  bind();
}

/* ---------- 7. CONCILIAÇÃO DE FONTES ---------- */
function vConcil(root) {
  if (!SER.length) { root.appendChild(el('div', 'painel', 'A planilha de custos não trouxe a série mensal.')); return; }
  const norm = s => s.toLowerCase().replace('/26', '/26').trim();
  const linhas = SER.map(s => {
    const k = MESES.findIndex(m => norm(m) === norm(s.mes));
    const dre = k >= 0 ? { obra: GRUPOS[0].v[k], pessoal: GRUPOS[1].v[k], veic: GRUPOS[2].v[k], gerais: GRUPOS[3].v[k], adm: GRUPOS[4].v[k], total: CUSTO[k] } : null;
    return { mes: s.mes, k, pain: s, dre, dif: dre ? s.total - dre.total : null };
  });
  const comDif = linhas.filter(l => l.dif !== null && Math.abs(l.dif) > 1);
  const semDRE = linhas.filter(l => l.k < 0);
  const totPain = sum(SER, s => s.total), totDRE = T.custo;
  root.appendChild(el('div', 'kpis', [
    kpi('Custo total · DRE', fR0(totDRE), `${MESES.length} meses até ${MESES[NM - 1]}`),
    kpi('Custo total · Painel de Custos', fR0(totPain), `${SER.length} meses até ${SER[SER.length - 1].mes}`, 'ouro'),
    kpi('Diferença entre as fontes', fR0(totPain - totDRE), 'inclui o mês previsto', Math.abs(totPain - totDRE) > 1000 ? 'warn' : 'ok'),
    kpi('Meses divergentes', fN(comDif.length), `de ${linhas.length - semDRE.length} meses comparáveis`, comDif.length ? 'warn' : 'ok'),
    kpi('Meses só no painel', fN(semDRE.length), semDRE.map(l => l.mes).join(', ') || 'nenhum'),
  ].join('')));
  const p = el('div', 'painel', `${legHTML([['DRE (Consolidado)', css('--rec')], ['Painel de Custos', css('--cus')]])}<div class="ch alto"><canvas></canvas></div>`);
  root.appendChild(sec('Custo mensal nas duas fontes', 'mesma competência, bases diferentes', p));
  chart(p.querySelector('canvas'), { type: 'bar', data: { labels: linhas.map(l => l.mes), datasets: [
    { label: 'DRE', data: linhas.map(l => l.dre ? l.dre.total : null), backgroundColor: css('--rec'), borderRadius: 4 },
    { label: 'Painel', data: linhas.map(l => l.pain.total), backgroundColor: css('--cus'), borderRadius: 4 }] },
    options: { plugins: { tooltip: tipR }, datasets: { bar: { barPercentage: .85, categoryPercentage: .72 } } } });
  root.appendChild(sec('Comparativo mês a mês', 'diferença = painel menos DRE', tabela([
    { t: 'Mês', k: 'mes' },
    { t: 'Custo DRE (R$)', k: r => r.dre ? r.dre.total : null, num: true, f: v => v === null ? '<span style="color:var(--ink3)">sem DRE</span>' : fR(v) },
    { t: 'Custo Painel (R$)', k: r => r.pain.total, num: true, f: fR },
    { t: 'Diferença (R$)', k: 'dif', num: true, f: v => v === null ? '–' : (Math.abs(v) < 1 ? '<span style="color:var(--ok)">alinhado</span>' : `<span style="color:var(--warn);font-weight:700">${fR(v)}</span>`) },
    { t: 'Diferença (%)', k: r => (r.dre && r.dre.total) ? r.dif / r.dre.total : null, num: true, f: v => v === null ? '–' : fP(v) },
    { t: 'Onde está a diferença', k: r => { if (!r.dre || Math.abs(r.dif) < 1) return ''; const ds = [['Custo em Obra', r.pain.obra - r.dre.obra], ['Pessoal', r.pain.pessoal - r.dre.pessoal], ['Veículos/Máquinas', r.pain.veic - r.dre.veic], ['Gastos Gerais', r.pain.gerais - r.dre.gerais]].filter(d => Math.abs(d[1]) > 1).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])); return ds.map(d => `${d[0]} ${d[1] >= 0 ? '+' : ''}${fK(d[1])}`).join(' · '); } },
  ], linhas, { semSort: true, total: (rs, c, i) => ['TOTAL', fR(totDRE), fR(totPain), fR(totPain - totDRE), '', ''][i] })));
  const w = el('div', 'painel');
  w.innerHTML = `<div class="sec-h"><h2>Como ler as duas fontes</h2></div><dl class="dl" style="grid-template-columns:230px 1fr">
    <dt>DRE_754 · Consolidado</dt><dd>Fechamento contábil por competência, conta a conta, de ${h(MESES[0])} a ${h(MESES[NM - 1])}. É a base do resultado e da margem.</dd>
    <dt>Painel de Custos</dt><dd>Série de custo por grupo com um mês a mais, alimentada pelo analítico de apropriações do SIENGE. Serve para antecipar o mês que ainda não fechou.</dd>
    <dt>Quando divergem</dt><dd>Meses já fechados devem bater. Divergência em mês fechado indica lançamento reclassificado depois da extração do painel, e quem vale para o resultado é o DRE.</dd></dl>
    <div class="nota">${h(D.meta.nota_serie || '')}</div>`;
  root.appendChild(sec('Procedência', '', w));
  if ((D.fontes || []).length) root.appendChild(sec('Extrações registradas', 'aba Data Sources da planilha de custos', tabela([
    { t: 'Origem', k: 'origem' }, { t: 'Objeto', k: 'objeto', cls: 'desc', f: v => h(trunc(v, 70)) }, { t: 'Parâmetros', k: 'params', cls: 'desc', f: v => h(trunc(v, 60)) },
    { t: 'Extraído em', k: 'quando' }, { t: 'Linhas', k: 'linhas', num: true }, { t: 'Observação', k: 'nota', cls: 'desc', f: v => h(trunc(v, 60)) },
  ], D.fontes, { semSort: true })));
  if (comDif.length) root.appendChild(el('div', 'dica', `<b>Atenção na conciliação.</b> ${comDif.length} ${comDif.length === 1 ? 'mês diverge' : 'meses divergem'} entre as duas fontes (${comDif.map(l => l.mes).join(', ')}), somando ${fR0(sum(comDif, l => Math.abs(l.dif)))} em valor absoluto. Antes de levar qualquer número de custo para a diretoria, vale reconciliar esses meses: o DRE é a fonte do resultado, o painel é a fonte da antecipação.`));
}

/* ---------- init ---------- */
(function () {
  const m = document.getElementById('meta');
  m.innerHTML = `<div><small>Competência</small><b>${h(MESES[NM - 1])}</b></div><div><small>Meses</small><b>${fN(ATIVOS.length)}</b></div><div><small>Margem acum.</small><b>${fP(T.margem)}</b></div><div><small>Extraído em</small><b>${fmtData(D.meta.extraido_em)}</b></div>`;
  try { const v = localStorage.getItem('dre.view'); if (v && VIEWS.some(x => x[0] === v)) STATE.view = v; } catch (e) { }
  nav(); show();
})();

</script>
