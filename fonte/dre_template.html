*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg2);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.45;font-variant-numeric:tabular-nums}
a{color:var(--azul)}
button,select,input{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
/* ---------- topo ---------- */
.topo{background:#3871C1;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.marca{display:flex;flex-direction:column;line-height:1;padding-right:22px;border-right:1px solid rgba(255,255,255,.35)}
.marca b{font-size:26px;letter-spacing:.12em;font-weight:900}
.marca span{font-size:9px;letter-spacing:.34em;margin-top:5px;opacity:.9}
.titulo h1{font-size:20px;font-weight:700;letter-spacing:.01em}
.titulo p{margin:3px 0 0;font-size:12px;opacity:.9}
.meta{margin-left:auto;display:flex;gap:18px;font-size:12px}
.meta div{display:flex;flex-direction:column;gap:2px}
.meta small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.meta b{font-size:14px}
/* ---------- abas ---------- */
.abas{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--linha);display:flex;gap:2px;padding:0 16px;overflow-x:auto;scrollbar-width:thin}
.abas button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 12px 9px;color:var(--ink2);cursor:pointer;white-space:nowrap;font-size:12.5px;font-weight:700;letter-spacing:.01em}
.abas button:hover{color:var(--ink);background:var(--bg2)}
.abas button.on{color:var(--azul);border-bottom-color:var(--azul)}
.abas button:focus-visible{outline:2px solid var(--azul);outline-offset:-2px}
main{padding:18px 24px 48px;max-width:1600px;margin:0 auto}
.view{display:none}.view.on{display:block}
/* ---------- blocos ---------- */
.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.sec-h h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--azul);font-weight:700}
.sec-h .sub{font-size:12px;color:var(--ink3)}
.painel{background:var(--bg);border:1px solid var(--linha);border-radius:6px;padding:14px 16px;box-shadow:var(--sombra)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--bg);border:1px solid var(--linha);border-top:4px solid var(--azul);border-radius:6px;padding:12px 14px 12px;box-shadow:var(--sombra);min-width:0}
.kpi.ouro{border-top-color:var(--ouro)}
.kpi.crit{border-top-color:var(--crit)}.kpi.warn{border-top-color:var(--warn)}.kpi.ok{border-top-color:var(--ok)}
.kpi small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.kpi b{display:block;font-size:22px;font-weight:700;color:var(--azul);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.ouro b{color:var(--ouro)}.kpi.crit b{color:var(--crit)}.kpi.warn b{color:var(--warn)}.kpi.ok b{color:var(--ok)}
.kpi em{display:block;font-style:normal;font-size:11.5px;color:var(--ink3);margin-top:4px}
/* ---------- filtros ---------- */
.filtros{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end;padding:12px 14px;background:var(--bg);border:1px solid var(--linha);border-radius:6px;margin-bottom:14px}
.filtros label{display:flex;flex-direction:column;gap:3px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.filtros select,.filtros input{border:1px solid var(--linha);background:var(--bg);border-radius:4px;padding:6px 8px;font-size:12.5px;min-width:130px;max-width:290px}
.filtros input[type=text],.filtros input[type=search]{min-width:220px}
.filtros input[type=number]{min-width:110px;max-width:140px}
.filtros .chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--linha);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--azul);border-color:var(--azul);color:#fff}
.btn{border:1px solid var(--linha);background:var(--bg);border-radius:4px;padding:6px 10px;font-size:12px;cursor:pointer;color:var(--ink)}
.btn:hover{background:var(--bg2)}
.btn.pri{background:var(--azul);border-color:var(--azul);color:#fff}
.conta{font-size:12px;color:var(--ink3);margin-left:auto;align-self:center}
/* ---------- tabelas ---------- */
.tw{overflow-x:auto;border:1px solid var(--linha);border-radius:6px;background:var(--bg)}
.tw.alto{max-height:70vh;overflow-y:auto}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.3px}
thead th{position:sticky;top:0;z-index:2;background:var(--azul-esc);color:#fff;font-weight:700;text-align:left;padding:8px 9px;white-space:nowrap;font-size:11px;letter-spacing:.04em;border-bottom:1px solid var(--linha)}
:root[data-theme="dark"] thead th{background:#2B4E80}
thead th.num{text-align:right}
thead th.sort{cursor:pointer;user-select:none}
thead th.sort:hover{background:var(--azul)}
thead th .seta{opacity:.6;font-size:9px;margin-left:3px}
tbody td{padding:6px 9px;border-bottom:1px solid var(--linha2);vertical-align:top}
tbody tr:nth-child(even) td{background:var(--bg2)}
tbody tr:hover td{background:var(--azul-tint)}
tbody tr.clk{cursor:pointer}
td.num,th.num{text-align:right;white-space:nowrap}
td.neg{color:var(--crit)}
td.pos{color:var(--ok)}
tfoot td,tr.total td{background:var(--ouro-tint)!important;color:var(--ink);font-weight:700;border-top:2px solid var(--ouro);padding:7px 9px;white-space:nowrap}
tr.grp td{background:var(--azul-tint)!important;font-weight:700;color:var(--azul-esc);cursor:pointer}
tr.grp.n2 td{background:var(--bg3)!important;color:var(--ink);font-weight:700}
tr.grp td .tri{display:inline-block;width:14px;color:var(--ink3);transition:transform .15s}
tr.grp.fechado td .tri{transform:rotate(-90deg)}
td.desc{min-width:280px;max-width:520px;white-space:normal}
td.mono{font-family:Consolas,Menlo,monospace;font-size:11.5px;white-space:nowrap}
.barra{display:inline-block;height:8px;border-radius:2px;background:var(--azul);vertical-align:middle;margin-right:6px}
.barra.ouro{background:var(--ouro)}.barra.crit{background:var(--crit)}.barra.warn{background:var(--warn)}.barra.ok{background:var(--ok)}
.pct{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pct i{display:inline-block;width:70px;height:7px;background:var(--bg3);border-radius:2px;overflow:hidden}
.pct i b{display:block;height:100%;background:var(--azul);border-radius:2px}
.tag{display:inline-block;padding:2px 7px;border-radius:3px;font-size:10.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.tag.A{background:var(--azul);color:#fff}.tag.B{background:var(--azul-tint2);color:var(--azul-esc)}.tag.C{background:var(--bg3);color:var(--ink2)}
.tag.ok{background:var(--ok-tint);color:var(--ok)}.tag.warn{background:var(--warn-tint);color:var(--warn)}.tag.crit{background:var(--crit-tint);color:var(--crit)}.tag.neu{background:var(--bg3);color:var(--ink2)}
.emp{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.emp i{width:9px;height:9px;border-radius:2px;display:inline-block}
.emp.MARKA i{background:var(--s-marka)}.emp.KLOG i{background:var(--s-klog)}.emp.VCA i{background:var(--s-vca)}.emp.x i{background:var(--ink3)}
/* heatmap */
.heat td.h{text-align:right;padding:5px 7px;font-size:11.5px}
/* charts */
.ch{position:relative;height:280px}
.ch.baixo{height:220px}.ch.alto{height:360px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-bottom:6px}
.leg span{display:inline-flex;align-items:center;gap:5px}.leg i{width:10px;height:10px;border-radius:2px;display:inline-block}
/* dica */
.dica{border-left:3px solid var(--ouro);background:var(--ouro-tint);padding:9px 12px;border-radius:0 4px 4px 0;font-size:12.3px;color:var(--ink);margin-top:10px}
.dica b{color:var(--ink)}
.nota{font-size:11.5px;color:var(--ink3);margin-top:8px}
/* drawer */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--bg);border-left:1px solid var(--linha);box-shadow:-8px 0 24px rgba(0,0,0,.15);z-index:40;transform:translateX(100%);transition:transform .2s;overflow-y:auto;padding:18px 20px}
.drawer.on{transform:none}
.drawer h3{font-size:15px;color:var(--azul);margin-bottom:4px}
.drawer .fech{position:absolute;top:10px;right:12px}
.dl{display:grid;grid-template-columns:150px 1fr;gap:4px 10px;font-size:12.3px;margin:12px 0}
.dl dt{color:var(--ink3);text-transform:uppercase;font-size:10.5px;letter-spacing:.08em;padding-top:2px}
.dl dd{margin:0}
.rodape{margin-top:32px;padding-top:12px;border-top:2px solid var(--azul);font-size:11.5px;color:var(--ink3);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media (max-width:760px){.topo{padding:12px 14px}.meta{margin-left:0}main{padding:12px 12px 40px}.kpi b{font-size:18px}}

.leg-exp{font-size:12.3px;color:var(--ink2);background:var(--bg2);border-left:3px solid var(--azul);padding:8px 12px;border-radius:0 4px 4px 0;margin-bottom:12px}
.leg-exp b{color:var(--ink)}
.sel-lin{display:flex;gap:6px;flex-wrap:wrap}
.sel-lin button{border:1px solid var(--linha);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:11.5px;cursor:pointer;color:var(--ink2)}
.sel-lin button.on{background:var(--azul);border-color:var(--azul);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* =====================================================================
   MOTOR · DRE e Custos da Obra 754 (OCG)
   Base mestre: aba Consolidado do DRE_754 (conta × mês, 17 meses)
   ===================================================================== */
const D = window.DRE, MESES = D.meta.meses, NM = MESES.length;
const REC = D.receita, ISS = D.iss;
const LIQ = REC.map((v, k) => v + ISS[k]);
const CONTAS = D.contas.map((c, i) => ({ ...c, idx: i, tot: c.v.reduce((a, b) => a + b, 0) }));
const GRUPOS = [];
for (const c of CONTAS) { let g = GRUPOS.find(x => x.cod === c.gcod); if (!g) { g = { cod: c.gcod, nome: c.grupo, v: new Array(NM).fill(0), n: 0 }; GRUPOS.push(g); } for (let k = 0; k < NM; k++) g.v[k] += c.v[k]; g.n++; }
GRUPOS.forEach(g => g.tot = g.v.reduce((a, b) => a + b, 0));
const CUSTO = MESES.map((m, k) => sum(GRUPOS, g => g.v[k]));
const LUCRO = MESES.map((m, k) => LIQ[k] - CUSTO[k]);
const T = { rec: sum(REC), iss: sum(ISS), liq: sum(LIQ), custo: sum(CUSTO), lucro: sum(LUCRO) };
T.margem = T.lucro / T.rec;
const ATIVOS = MESES.map((m, k) => k).filter(k => CUSTO[k] > 0 || REC[k] > 0);
const COM_REC = MESES.map((m, k) => k).filter(k => REC[k] > 0);
const ULT = ATIVOS[ATIVOS.length - 1];
// série do painel de custos (inclui ago/26 previsto)
const SER = D.serie || [];
const GCORES = ['--g1', '--g2', '--g3', '--g4', '--g5'];
function sum(a, f) { let s = 0; for (const x of a) s += f ? f(x) : x; return s; }
function uniq(a) { return [...new Set(a.filter(x => x !== undefined && x !== ''))]; }
/* ---------- formatação ---------- */
const fR = v => (v < 0 ? '-' : '') + 'R$ ' + Math.abs(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fR0 = v => (v < 0 ? '-' : '') + 'R$ ' + Math.abs(v).toLocaleString('pt-BR', { maximumFractionDigits: 0 });
const fK = v => { const a = Math.abs(v), s = v < 0 ? '-' : ''; if (a >= 1e6) return s + (a / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + ' mi'; if (a >= 1e3) return s + (a / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' mil'; return s + a.toLocaleString('pt-BR', { maximumFractionDigits: 0 }); };
const fP = (v, d = 1) => (v === null || v === undefined || !isFinite(v)) ? '–' : (v * 100).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%';
const fN = v => v.toLocaleString('pt-BR');
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const trunc = (s, n = 90) => s.length > n ? s.slice(0, n - 1) + '…' : s;
const sinal = v => v >= 0 ? 'var(--ok)' : 'var(--crit)';
const cor = (v, t) => `<span style="color:${sinal(v)}">${t}</span>`;
const numCls = v => v < -0.005 ? 'num neg' : 'num';
const pctBar = (v, cls = '') => `<span class="pct"><i><b style="width:${Math.max(0, Math.min(100, v * 100))}%" class="${cls}"></b></i>${fP(v)}</span>`;
const gTag = g => { const i = GRUPOS.findIndex(x => x.nome === g); return `<span class="emp"><i style="background:${css(GCORES[i % 5])}"></i>${h(g)}</span>`; };
/* ---------- tabela ---------- */
let TID = 0;
function tabela(cols, rows, opt = {}) {
  const st = { sort: opt.sort ?? null, dir: opt.dir ?? -1 };
  const el = document.createElement('div'); el.className = 'tw' + (opt.alto ? ' alto' : '');
  function val(r, c) { return typeof c.k === 'function' ? c.k(r) : r[c.k]; }
  function render() {
    let rs = [...rows];
    if (st.sort !== null) { const c = cols[st.sort]; rs.sort((a, b) => { const x = val(a, c), y = val(b, c); if (x === y) return 0; if (x == null) return 1; if (y == null) return -1; return (x > y ? 1 : -1) * st.dir; }); }
    if (opt.limite) rs = rs.slice(0, opt.limite);
    let html = '<table><thead><tr>' + cols.map((c, i) => `<th class="${c.num ? 'num ' : ''}${opt.semSort ? '' : 'sort'}" data-i="${i}" ${c.w ? `style="min-width:${c.w}px"` : ''}>${h(c.t)}${st.sort === i ? `<span class="seta">${st.dir > 0 ? '▲' : '▼'}</span>` : ''}</th>`).join('') + '</tr></thead><tbody>';
    if (!rs.length) html += `<tr><td colspan="${cols.length}" style="text-align:center;color:var(--ink3);padding:18px">Nenhuma linha para os filtros atuais.</td></tr>`;
    for (const r of rs) html += `<tr class="${r._cls || ''}">` + cols.map(c => { const v = val(r, c); return `<td class="${c.num ? (c.neg ? numCls(v) : 'num') : (c.cls || '')}">${c.f ? c.f(v, r) : h(v ?? '')}</td>`; }).join('') + '</tr>';
    html += '</tbody>';
    if (opt.total) html += '<tfoot><tr>' + cols.map((c, i) => `<td class="${c.num ? 'num' : ''}">${opt.total(rs, c, i) ?? ''}</td>`).join('') + '</tr></tfoot>';
    el.innerHTML = html + '</table>';
    if (!opt.semSort) el.querySelectorAll('th.sort').forEach(th => th.onclick = () => { const i = +th.dataset.i; if (st.sort === i) st.dir *= -1; else { st.sort = i; st.dir = cols[i].num ? -1 : 1; } render(); });
  }
  render(); return el;
}
/* ---------- charts ---------- */
const CH = [];
function chart(canvas, cfg) {

  Chart.defaults.plugins.legend.display = false;
  Chart.defaults.plugins.tooltip.backgroundColor = css('--ink'); Chart.defaults.plugins.tooltip.titleColor = css('--bg'); Chart.defaults.plugins.tooltip.bodyColor = css('--bg');
  Chart.defaults.plugins.tooltip.padding = 8; Chart.defaults.plugins.tooltip.cornerRadius = 4;
  const base = { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false },
    scales: { x: { grid: { display: false }, border: { color: grid }, ticks: { color: ink3 } }, y: { grid: { color: grid, drawTicks: false }, border: { display: false }, ticks: { color: ink3, callback: v => fK(v) } } } };
  cfg.options = deepMerge(base, cfg.options || {});
  const c = new Chart(canvas, cfg); CH.push(c); return c;
}
function deepMerge(a, b) { const o = { ...a }; for (const k in b) o[k] = (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object') ? deepMerge(a[k], b[k]) : b[k]; return o; }
function destroyCharts() { CH.forEach(c => c.destroy()); CH.length = 0; }
const tipR = { callbacks: { label: c => ` ${c.dataset.label ? c.dataset.label + ': ' : ''}${fR0(Math.abs(c.parsed.y ?? c.parsed.x ?? c.parsed))}` } };
const legHTML = items => `<div class="leg">${items.map(([n, c]) => `<span><i style="background:${c}"></i>${h(n)}</span>`).join('')}</div>`;
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function sec(title, sub, ...kids) { const s = el('section', 'sec', `<div class="sec-h"><h2>${h(title)}</h2>${sub ? `<span class="sub">${sub}</span>` : ''}</div>`); kids.forEach(k => k && s.appendChild(typeof k === 'string' ? el('div', '', k) : k)); return s; }
function kpi(label, val, note, cls = '') { return `<div class="kpi ${cls}"><small>${h(label)}</small><b title="${h(val)}">${h(val)}</b>${note ? `<em>${note}</em>` : ''}</div>`; }
function selectHTML(id, label, opts, cur, all) { return `<label>${h(label)}<select id="${id}">${all ? `<option value="">${h(all)}</option>` : ''}${opts.map(o => `<option value="${h(o)}" ${o === cur ? 'selected' : ''}>${h(o)}</option>`).join('')}</select></label>`; }
function seq(v, max) { const s = ['--seq1', '--seq2', '--seq3', '--seq4', '--seq5', '--seq6']; if (v <= 0 || max <= 0) return 'transparent'; const t = Math.min(1, v / max); return css(s[Math.min(5, Math.floor(t * 5.999))]); }
function fmtData(s) { const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; }
/* ====== biblioteca de gráficos ====== */
/* =====================================================================
   QUATRO FORMAS DE LEITURA · módulo comum aos painéis Marka
   bump (ranking no tempo) · slope (dois momentos) · cascata (composição)
   · histograma com densidade (distribuição)
   Depende de: chart(), css(), fK(), fR0(), fP(), h(), el(), trunc(), sum()
   ===================================================================== */
const CAT6 = ['--c1', '--c2', '--c3', '--c4', '--c5', '--c6'];
const corCat = i => css(CAT6[i % 6]);

/* ---------- 1. BUMP · posição no ranking período a período ---------- */
function bumpChart(canvas, series, labels, opt = {}) {
  // series: [{nome, v:[...]}] — o ranking é recalculado em cada período
  const N = labels.length, S = series.length;
  const rank = series.map(() => new Array(N).fill(null));
  for (let k = 0; k < N; k++) {
    const ord = series.map((s, i) => ({ i, v: s.v[k] })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
    ord.forEach((x, pos) => rank[x.i][k] = pos + 1);
  }
  const ds = series.map((s, i) => ({
    label: s.nome, data: rank[i], borderColor: corCat(i), backgroundColor: corCat(i),
    borderWidth: 2.5, pointRadius: 5, pointHoverRadius: 8, pointBorderColor: css('--bg'), pointBorderWidth: 2,
    tension: 0, spanGaps: false,
  }));
  return chart(canvas, { type: 'line', data: { labels, datasets: ds }, options: {
    scales: { y: { reverse: true, min: .5, max: S + .5, ticks: { stepSize: 1, callback: v => Number.isInteger(v) && v >= 1 && v <= S ? v + 'º' : '' }, title: { display: true, text: 'posição no ranking', color: css('--ink3') } },
      x: { ticks: { maxRotation: 0, autoSkip: false, font: { size: 10 } } } },
    plugins: { tooltip: { callbacks: {
      title: c => labels[c[0].dataIndex],
      label: c => ` ${c.parsed.y}º · ${c.dataset.label}: ${fK(series[c.datasetIndex].v[c.dataIndex])}` } } } } });
}

/* ---------- 2. SLOPE · o que mudou entre dois momentos ---------- */
function slopeChart(canvas, linhas, rotA, rotB, opt = {}) {
  // linhas: [{nome, a, b}] — dois pontos por linha
  const fmt = opt.fmt || fK;
  const ds = linhas.map((l, i) => {
    const sobe = l.b >= l.a;
    const c = opt.corPorSinal ? (sobe ? css('--crit') : css('--ok')) : corCat(i);
    return { label: l.nome, data: [l.a, l.b], borderColor: c, backgroundColor: c, borderWidth: 2.5,
      pointRadius: 6, pointHoverRadius: 9, pointBorderColor: css('--bg'), pointBorderWidth: 2, tension: 0 };
  });
  return chart(canvas, { type: 'line', data: { labels: [rotA, rotB], datasets: ds }, options: {
    layout: { padding: { right: 12, left: 12 } },
    scales: { x: { grid: { display: false }, ticks: { font: { size: 12, weight: '700' } } },
      y: { ticks: { callback: v => fmt(v) } } },
    plugins: { tooltip: { callbacks: {
      label: c => ` ${c.dataset.label}: ${fmt(c.parsed.y)}`,
      afterBody: c => { const l = linhas[c[0].datasetIndex]; const d = l.b - l.a;
        return `variação ${d >= 0 ? '+' : ''}${fmt(d)}${l.a ? ` (${d / l.a >= 0 ? '+' : ''}${fP(d / l.a, 0)})` : ''}`; } } } } } });
}

/* ---------- 3. CASCATA · como se chega de um total a outro ---------- */
function cascataChart(canvas, passos, opt = {}) {
  // passos: [{nome, v, tipo:'inicio'|'delta'|'total'}]
  const fmt = opt.fmt || fK;
  let acum = 0; const flut = [], cores = [], valores = [];
  for (const p of passos) {
    if (p.tipo === 'inicio' || p.tipo === 'total') { const base = p.tipo === 'inicio' ? 0 : 0; const topo = p.tipo === 'inicio' ? p.v : acum;
      flut.push([base, p.tipo === 'inicio' ? p.v : acum]); valores.push(p.tipo === 'inicio' ? p.v : acum);
      cores.push(css('--azul-esc')); if (p.tipo === 'inicio') acum = p.v; }
    else { const ini = acum; acum += p.v; flut.push([Math.min(ini, acum), Math.max(ini, acum)]); valores.push(p.v);
      cores.push(p.v >= 0 ? css('--ok') : css('--c2')); }
  }
  return chart(canvas, { type: 'bar', data: { labels: passos.map(p => p.nome), datasets: [{ data: flut, backgroundColor: cores, borderRadius: 4, barPercentage: .7 }] },
    options: { scales: { x: { ticks: { maxRotation: 30, minRotation: 0, autoSkip: false, font: { size: 10 } } }, y: { ticks: { callback: v => fmt(v) } } },
      plugins: { tooltip: { callbacks: { label: c => { const p = passos[c.dataIndex];
        return p.tipo === 'delta' ? ` ${p.v >= 0 ? 'entra' : 'sai'} ${fmt(Math.abs(p.v))}` : ` ${fmt(valores[c.dataIndex])}`; },
        afterLabel: c => passos[c.dataIndex].nota || '' } } } } });
}

/* ---------- 4. HISTOGRAMA COM DENSIDADE ---------- */
function kde(dados, grade, banda) {
  // núcleo gaussiano; banda por regra de Silverman se não informada
  const n = dados.length; if (!n) return grade.map(() => 0);
  const media = sum(dados) / n;
  const dp = Math.sqrt(sum(dados.map(x => (x - media) ** 2)) / n) || 1;
  const ord = [...dados].sort((a, b) => a - b);
  const q = p => ord[Math.min(n - 1, Math.max(0, Math.floor(p * (n - 1))))];
  const iqr = q(.75) - q(.25);
  const bw = banda || 0.9 * Math.min(dp, iqr / 1.349 || dp) * Math.pow(n, -0.2) || dp / 3;
  return grade.map(x => sum(dados.map(d => Math.exp(-0.5 * ((x - d) / bw) ** 2))) / (n * bw * Math.sqrt(2 * Math.PI)));
}
function histogramaDensidade(canvas, dados, opt = {}) {
  const nbins = opt.bins || Math.max(8, Math.min(24, Math.ceil(Math.sqrt(dados.length))));
  const min = opt.min !== undefined ? opt.min : Math.min(...dados);
  const max = opt.max !== undefined ? opt.max : Math.max(...dados);
  const larg = (max - min) / nbins || 1;
  const centros = [], contagem = new Array(nbins).fill(0);
  for (let i = 0; i < nbins; i++) centros.push(min + larg * (i + .5));
  for (const d of dados) { let i = Math.floor((d - min) / larg); if (i >= nbins) i = nbins - 1; if (i < 0) i = 0; contagem[i]++; }
  // densidade na mesma unidade da contagem: dens × n × largura do bin
  const dens = kde(dados, centros, opt.banda).map(v => v * dados.length * larg);
  const fmt = opt.fmt || (v => v.toLocaleString('pt-BR', { maximumFractionDigits: 1 }));
  return chart(canvas, { data: { labels: centros.map(c => fmt(c)), datasets: [
      { type: 'bar', label: 'Itens no intervalo', data: contagem, backgroundColor: css('--azul-claro'), borderRadius: 3, barPercentage: 1, categoryPercentage: .92, order: 2 },
      { type: 'line', label: 'Densidade', data: dens, borderColor: css('--ouro'), backgroundColor: 'transparent', borderWidth: 2.5, pointRadius: 0, tension: .35, order: 1 }] },
    options: { scales: { x: { ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 10, font: { size: 10 } }, title: { display: !!opt.eixoX, text: opt.eixoX || '', color: css('--ink3') } },
        y: { title: { display: true, text: 'nº de ocorrências', color: css('--ink3') } } },
      plugins: { tooltip: { callbacks: {
        title: c => `${opt.rotulo || 'faixa'} ≈ ${c[0].label}`,
        label: c => c.dataset.type === 'bar' ? ` ${c.parsed.y} ocorrência(s)` : ` densidade ${c.parsed.y.toLocaleString('pt-BR', { maximumFractionDigits: 1 })}` } } } } });
}

/* ---------- moldura explicativa de cada gráfico ---------- */

/* ---------- ANÁLISES · quatro formas de leitura ---------- */
function vAnalises(root) {
  const MA = ATIVOS.map(k => MESES[k]);
  const S = STATE.anal ||= { a: 0, b: MA.length - 1, dim: 'conta' };
  const f = el('div', 'filtros'); const out = el('div'); root.append(f, out);
  const dims = { conta: 'Conta', grupo: 'Grupo' };
  function bind() {
    f.innerHTML = `<label>Ranking por<span class="sel-lin">${Object.entries(dims).map(([k, v]) => `<button class="${S.dim === k ? 'on' : ''}" data-d="${k}">${v}</button>`).join('')}</span></label>
      ${selectHTML('a', 'Comparar de', MA, MA[S.a])}${selectHTML('b', 'até', MA, MA[S.b])}
      <span class="conta">os dois meses valem para o gráfico de inclinação</span>`;
    f.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { S.dim = b.dataset.d; bind(); });
    f.querySelector('#a').onchange = e => { S.a = MA.indexOf(e.target.value); draw(); };
    f.querySelector('#b').onchange = e => { S.b = MA.indexOf(e.target.value); draw(); };
    draw();
  }
  function draw() {
    destroyCharts(); out.innerHTML = '';
    const base = S.dim === 'conta' ? CONTAS.map(c => ({ k: c.conta, v: c.v, tot: c.tot })) : GRUPOS.map(g => ({ k: g.nome, v: g.v, tot: g.tot }));
    const ord = [...base].sort((x, y) => y.tot - x.tot);
    const top = ord.slice(0, 6);

    // 1. BUMP
    const b1 = blocoGrafico(`Ranking de custo por mês`,
      `cada linha é ${S.dim === 'conta' ? 'uma conta' : 'um grupo'}; quanto mais alto, maior foi o custo naquele mês. Cruzamento de linhas significa troca de posição.`,
      'para ver qual conta puxa o custo em cada mês e quando essa liderança muda. Mostra ordem, não tamanho: leia junto com a aba Mês a Mês.');
    out.appendChild(sec('1 · Bump chart', `as ${top.length} maiores por custo acumulado`, b1));
    bumpChart(b1.querySelector('canvas'), top.map(g => ({ nome: trunc(g.k, 28), v: ATIVOS.map(k => g.v[k]) })), MA);
    out.appendChild(el('div', 'leg', top.map((g, i) => `<span><i style="background:${corCat(i)}"></i>${h(trunc(g.k, 34))}</span>`).join('')));

    // 2. SLOPE
    const ia = ATIVOS[S.a], ib = ATIVOS[S.b];
    const linhas = GRUPOS.map(g => ({ nome: trunc(g.nome, 26), a: g.v[ia], b: g.v[ib] })).filter(r => r.a > 0 || r.b > 0).sort((x, y) => y.b - x.b);
    const b2 = blocoGrafico(`Custo por grupo de ${MA[S.a]} para ${MA[S.b]}`,
      'cada linha liga o custo do grupo nos dois meses. Linha subindo é grupo que cresceu; linha descendo é grupo que recuou.',
      'para comparar a composição do custo em dois momentos sem a poluição da série cheia. Bom para justificar variação de margem.');
    out.appendChild(sec('2 · Slope chart', 'custo mensal por grupo, em reais', b2));
    slopeChart(b2.querySelector('canvas'), linhas, MA[S.a], MA[S.b], { fmt: fK });
    out.appendChild(sec('', '', tabela([
      { t: 'Grupo', k: 'nome' }, { t: MA[S.a], k: 'a', num: true, f: v => fR0(v) }, { t: MA[S.b], k: 'b', num: true, f: v => fR0(v) },
      { t: 'Variação', k: r => r.b - r.a, num: true, f: v => `<span style="color:${v > 0 ? 'var(--crit)' : 'var(--ok)'}">${v > 0 ? '+' : '-'}${fR0(Math.abs(v))}</span>` },
      { t: '%', k: r => r.a > 0 ? (r.b - r.a) / r.a : null, num: true, f: v => v === null ? '–' : fP(v, 0) },
    ], linhas, { semSort: true })));

    // 3. CASCATA
    const gord = [...GRUPOS].sort((x, y) => y.tot - x.tot);
    const passos = [{ nome: 'Receita bruta', v: T.rec, tipo: 'inicio' },
      { nome: 'ISS', v: T.iss, nota: fP(Math.abs(T.iss) / T.rec) + ' da receita' },
      ...gord.map(g => ({ nome: trunc(g.nome, 18), v: -g.tot, nota: `${fP(g.tot / T.custo)} do custo` })),
      { nome: T.lucro >= 0 ? 'Lucro' : 'Prejuízo', v: 0, tipo: 'total' }];
    const b3 = blocoGrafico('Da receita ao resultado',
      'a barra azul da esquerda é a receita bruta; cada barra laranja é uma dedução (imposto ou grupo de custo); a barra azul da direita é o que sobra.',
      'para mostrar à diretoria por onde o resultado foi construído, e não só quanto ele é. É a leitura mais direta de uma DRE.');
    out.appendChild(sec('3 · Cascata', 'DRE acumulada do contrato', b3));
    cascataChart(b3.querySelector('canvas'), passos, { fmt: fK });
    out.appendChild(el('div', 'dica', `<b>Leitura.</b> Receita bruta de ${fR0(T.rec)} menos ISS de ${fR0(Math.abs(T.iss))} e custo de ${fR0(T.custo)} resulta em ${fR0(T.lucro)}, margem de ${fP(T.margem)} sobre a receita bruta.`));

    // 4. HISTOGRAMA
    const vals = []; for (const c of CONTAS) for (const k of ATIVOS) if (c.v[k] > 0) vals.push(c.v[k]);
    vals.sort((a, b) => a - b);
    const p95 = vals[Math.floor(vals.length * .95)] || 1;
    const cort = vals.map(v => Math.min(v, p95));
    const b4 = blocoGrafico('Distribuição do gasto mensal por conta',
      'cada barra conta quantos lançamentos conta × mês caíram naquela faixa de valor; a linha dourada é a densidade, que suaviza o desenho e mostra onde a massa se concentra.',
      'para separar o custo de rotina, que é a maioria dos lançamentos, dos poucos lançamentos grandes que decidem o mês. Serve de base para definir alçada de conferência.');
    out.appendChild(sec('4 · Histograma com densidade', `${fN(vals.length)} lançamentos conta × mês com valor`, b4));

    const grandes = vals.filter(v => v > p95).length, somaGr = sum(vals.filter(v => v > p95));
    out.appendChild(el('div', 'dica', `<b>O que a distribuição mostra.</b> A massa dos lançamentos é pequena e repetitiva. Os ${fN(grandes)} lançamentos acima de ${fK(p95)} (${fP(grandes / vals.length)} do total) somam ${fR0(somaGr)}, ou ${fP(somaGr / T.custo)} do custo do contrato. É neles que a conferência de nota e medição precisa se concentrar.`));
  }
  bind();
}

    destroyCharts(); out.innerHTML = '';

          `<td class="num" style="font-weight:700;${col}">${S.av ? (T.rec ? fP(tot / T.rec, 0) : '–') : fK(tot)}</td></tr>`; }).join('') +

/* ---------- 4. CONTAS ---------- */
function vContas(root) {
  const S = STATE.contas ||= { q: '', grupo: '', so: true };
  const f = el('div', 'filtros'); const out = el('div'); root.append(f, out);
  function bind() {
    f.innerHTML = `<label>Buscar<input type="search" id="q" value="${h(S.q)}" placeholder="conta ou código contábil"></label>
      ${selectHTML('grupo', 'Grupo', GRUPOS.map(g => g.nome), S.grupo, 'Todos')}
      <label>Filtro rápido<span class="chips"><button class="chip ${S.so ? 'on' : ''}" id="so">Só contas com lançamento</button></span></label>
      <button class="btn" id="limpar">Limpar filtros</button><span class="conta" id="conta"></span>`;
    f.querySelector('#q').oninput = e => { S.q = e.target.value; draw(); };
    f.querySelector('#grupo').onchange = e => { S.grupo = e.target.value; draw(); };
    f.querySelector('#so').onclick = () => { S.so = !S.so; bind(); };
    f.querySelector('#limpar').onclick = () => { Object.assign(S, { q: '', grupo: '', so: true }); bind(); };
    draw();
  }
  function draw() {
    destroyCharts(); out.innerHTML = '';
    const q = S.q.trim().toLowerCase();
    const rows = CONTAS.filter(c => (!S.grupo || c.grupo === S.grupo) && (!S.so || c.tot > 0) && (!q || c.conta.toLowerCase().includes(q) || c.cod.includes(q)));
    const tot = sum(rows, r => r.tot);
    f.querySelector('#conta').textContent = `${fN(rows.length)} de ${fN(CONTAS.length)} contas · ${fK(tot)} acumulados · ${fP(tot / T.custo)} do custo`;
    const top = [...rows].sort((a, b) => b.tot - a.tot).slice(0, 12);
    const p = el('div', 'painel', `<div class="sec-h"><h2>Maiores contas do recorte</h2><span class="sub">acumulado do contrato</span></div><div class="ch alto"><canvas></canvas></div>`);
    out.appendChild(sec('Concentração', '', p));
    chart(p.querySelector('canvas'), { type: 'bar', data: { labels: top.map(c => trunc(c.conta, 30)), datasets: [{ data: top.map(c => c.tot), backgroundColor: top.map(c => css(GCORES[GRUPOS.findIndex(g => g.nome === c.grupo) % 5])), borderRadius: 4 }] },
      options: { indexAxis: 'y', scales: { x: { grid: { color: css('--linha2') }, ticks: { callback: v => fK(v) } }, y: { grid: { display: false }, ticks: { autoSkip: false, font: { size: 10.5 }, callback: function (v) { return this.getLabelForValue(v); } } } }, plugins: { tooltip: { callbacks: { label: c => ` ${fR0(c.parsed.x)} · ${fP(c.parsed.x / T.custo)} do custo` } } }, datasets: { bar: { barPercentage: .78 } } } });
    const max = Math.max(...rows.flatMap(c => c.v), 1);
    const w = el('div', 'tw alto');
    w.innerHTML = `<table class="heat"><thead><tr><th style="min-width:210px">Conta</th><th>Código</th><th>Grupo</th>${MESES.map(m => `<th class="num">${h(m)}</th>`).join('')}<th class="num">TOTAL</th><th class="num">% custo</th><th class="num">Média/mês</th></tr></thead><tbody>` +
      [...rows].sort((a, b) => b.tot - a.tot).map(c => { const ativos = c.v.filter(v => v > 0).length;
        return `<tr><td style="white-space:nowrap" title="${h(c.conta)}">${h(trunc(c.conta, 34))}</td><td class="mono">${h(c.cod)}</td><td>${gTag(c.grupo)}</td>` +
          c.v.map(v => `<td class="h" style="background:${seq(v, max)};color:${v / max > .6 ? '#fff' : 'var(--ink)'}" title="${fR(v)}">${v ? fK(v) : '<span style="color:var(--ink3)">·</span>'}</td>`).join('') +
          `<td class="num"><b>${fK(c.tot)}</b></td><td class="num">${fP(c.tot / T.custo)}</td><td class="num">${ativos ? fK(c.tot / ativos) : '–'}</td></tr>`; }).join('') +
      `</tbody><tfoot><tr><td>TOTAL DO RECORTE</td><td></td><td></td>${MESES.map((m, k) => `<td class="num">${fK(sum(rows, r => r.v[k]))}</td>`).join('')}<td class="num">${fK(tot)}</td><td class="num">${fP(tot / T.custo)}</td><td class="num"></td></tr></tfoot></table>`;
    out.appendChild(sec('Todas as contas · mês a mês', 'a média por mês considera apenas os meses com lançamento na conta', w));
    // curva ABC das contas
    const ord = [...CONTAS].filter(c => c.tot > 0).sort((a, b) => b.tot - a.tot);
    let acc = 0; const abc = ord.map(c => { acc += c.tot; return { ...c, acum: acc / T.custo }; });
    const cA = abc.filter(c => c.acum <= 0.8).length, cB = abc.filter(c => c.acum > 0.8 && c.acum <= 0.95).length;
    out.appendChild(el('div', 'dica', `<b>Concentração.</b> ${cA} contas respondem por 80% do custo acumulado e mais ${cB} chegam a 95%; as demais ${abc.length - cA - cB} somam os últimos 5%. Acompanhar de perto essas ${cA} contas cobre a maior parte do risco de desvio de custo.`));
  }
  bind();
}

    ], linhas, { semSort: true })),

        setTimeout(() => chart(p.querySelector('canvas'), { type: 'bar', data: { labels: GRUPOS.map(x => trunc(x.nome, 18)), datasets: [{ label: MESES[k], data: GRUPOS.map(x => x.v[k]), backgroundColor: css('--cus'), borderRadius: 4 }, { label: 'Média 3M', data: GRUPOS.map(x => m3(x.v)), backgroundColor: css('--azul-claro'), borderRadius: 4 }] },

      { t: '% do custo do mês', k: r => r.v[k] / CUSTO[k], num: true, f: v => pctBar(v) },
      { t: 'Mês anterior (R$)', k: r => kp === null ? null : r.v[kp], num: true, f: v => v === null ? '–' : fR0(v) },
      { t: 'Var vs anterior', k: r => (kp === null || !r.v[kp]) ? null : r.v[k] / r.v[kp] - 1, num: true, f: v => v === null ? '–' : cor(-v, (v >= 0 ? '+' : '') + fP(v, 0)) },
      { t: 'Média 3M (R$)', k: r => m3(r.v), num: true, f: fR0 },
    ], doMes, { alto: true, semSort: true, total: (rs, c, i) => ['TOTAL', '', '', '', fR(CUSTO[k]), fP(1), kp === null ? '–' : fR0(CUSTO[kp]), '', fR0(m3(CUSTO))][i] })));
    const alta = CONTAS.filter(c => c.v[k] > 0 && m3(c.v) > 0).map(c => ({ ...c, d: c.v[k] - m3(c.v) })).sort((a, b) => b.d - a.d).slice(0, 5);
    const queda = CONTAS.filter(c => m3(c.v) > 0).map(c => ({ ...c, d: c.v[k] - m3(c.v) })).sort((a, b) => a.d - b.d).slice(0, 5);
    const g2 = el('div', 'grid g2');
    const tv = (titulo, rows) => sec(titulo, 'contra a média dos 3 meses anteriores', tabela([
      { t: 'Conta', k: 'conta', cls: 'desc', f: v => h(trunc(v, 46)) }, { t: 'Grupo', k: 'grupo', f: gTag },
      { t: 'No mês (R$)', k: r => r.v[k], num: true, f: fR0 }, { t: 'Média 3M (R$)', k: r => m3(r.v), num: true, f: fR0 },
      { t: 'Variação (R$)', k: 'd', num: true, f: v => cor(-v, fR0(v)) },
    ], rows, { semSort: true }));
    g2.append(tv('Maiores altas do mês', alta), tv('Maiores quedas do mês', queda));
    out.appendChild(g2);
  }
  draw();
}
/* ---------- 6. MATERIAL E FORNECEDORES ---------- */
function vMaterial(root) {
  const MM = D.meta.mat_meses, NMM = MM.length;
  const FOR = (D.fornecedores || []).map((x, i) => ({ ...x, idx: i, tot: x.v.reduce((a, b) => a + b, 0) }));
  const CAT = (D.categorias || []).map((x, i) => ({ ...x, idx: i, tot: x.v.reduce((a, b) => a + b, 0) }));
  const MS = D.mat_serie || [];
  if (!FOR.length) { root.appendChild(el('div', 'painel', 'A planilha de custos não trouxe o detalhe de material.')); return; }
  const S = STATE.mat ||= { k: NMM - 1, q: '', cat: '' };
  const f = el('div', 'filtros'); const out = el('div'); root.append(f, out);
  function bind() {
    f.innerHTML = selectHTML('sel', 'Mês do detalhe', MM, MM[S.k]) +
      `<label>Buscar fornecedor<input type="search" id="q" value="${h(S.q)}" placeholder="nome do fornecedor"></label>` +
      selectHTML('cat', 'Categoria', uniq(FOR.map(x => x.cat)).sort(), S.cat, 'Todas') +
      `<button class="btn" id="limpar">Limpar</button><span class="conta">detalhe por fornecedor disponível de ${h(MM[0])} a ${h(MM[NMM - 1])}</span>`;
    f.querySelector('#sel').onchange = e => { S.k = MM.indexOf(e.target.value); draw(); };
    f.querySelector('#q').oninput = e => { S.q = e.target.value; draw(); };
    f.querySelector('#cat').onchange = e => { S.cat = e.target.value; draw(); };
    f.querySelector('#limpar').onclick = () => { Object.assign(S, { q: '', cat: '' }); bind(); };
    draw();
  }
  function draw() {
    destroyCharts(); out.innerHTML = ''; const k = S.k, kp = k > 0 ? k - 1 : null;
    const totMes = sum(FOR, x => x.v[k]);
    const ativos = FOR.filter(x => x.v[k] > 0);
    const novos = FOR.filter(x => x.v[k] > 0 && (kp === null || x.v.slice(0, k).every(v => v === 0)));
    const top5 = [...ativos].sort((a, b) => b.v[k] - a.v[k]).slice(0, 5);
    const matAcum = sum(CONTAS.filter(c => c.conta.toLowerCase().startsWith('obras (material')), c => c.tot);
    out.appendChild(el('div', 'kpis', [
      kpi(`Material em ${MM[k]}`, fR0(totMes), kp !== null ? `${totMes - sum(FOR, x => x.v[kp]) >= 0 ? '▲' : '▼'} ${fK(Math.abs(totMes - sum(FOR, x => x.v[kp])))} vs ${MM[kp]}` : '', 'ouro'),
      kpi('Fornecedores ativos', fN(ativos.length), `de ${FOR.length} na base`),
      kpi('Fornecedores novos no mês', fN(novos.length), novos.length ? trunc(novos[0].nome, 24) : 'nenhum'),
      kpi('Concentração top 5', fP(sum(top5, x => x.v[k]) / (totMes || 1)), 'do material do mês'),
      kpi('Material acumulado no contrato', fR0(matAcum), 'conta Obras (material) no DRE'),
    ].join('')));
    const g = el('div', 'grid g2');
    const p1 = el('div', 'painel', `<div class="sec-h"><h2>Material por mês</h2><span class="sub">com número de lançamentos</span></div><div class="ch"><canvas></canvas></div>`);
    const p2 = el('div', 'painel', `<div class="sec-h"><h2>Top 10 fornecedores de ${h(MM[k])}</h2></div><div class="ch"><canvas></canvas></div>`);
    g.append(p1, p2); out.appendChild(sec('Visão do material', '', g));
    chart(p1.querySelector('canvas'), { type: 'bar', data: { labels: MS.map(x => x.mes.replace('/2026', '/26').replace(' (previsto)', ' *')), datasets: [{ data: MS.map(x => x.total), backgroundColor: MS.map(x => x.mes.includes('previsto') ? css('--azul-claro') : css('--azul')), borderRadius: 4, barPercentage: .6 }] },
      options: { plugins: { tooltip: { callbacks: { label: c => ` ${fR0(c.parsed.y)} · ${MS[c.dataIndex].lanc} lançamentos` } } } } });
    const t10 = [...ativos].sort((a, b) => b.v[k] - a.v[k]).slice(0, 10);
    chart(p2.querySelector('canvas'), { type: 'bar', data: { labels: t10.map(x => trunc(x.nome, 26)), datasets: [{ data: t10.map(x => x.v[k]), backgroundColor: css('--azul'), borderRadius: 4 }] },
      options: { indexAxis: 'y', scales: { x: { grid: { color: css('--linha2') }, ticks: { callback: v => fK(v) } }, y: { grid: { display: false }, ticks: { autoSkip: false, font: { size: 10 }, callback: function (v) { return this.getLabelForValue(v); } } } }, plugins: { tooltip: { callbacks: { label: c => ` ${fR0(c.parsed.x)} · ${fP(c.parsed.x / totMes)} do material` } } }, datasets: { bar: { barPercentage: .78 } } } });
    const q = S.q.trim().toLowerCase();
    const rows = FOR.filter(x => (!S.cat || x.cat === S.cat) && (!q || x.nome.toLowerCase().includes(q)));
    out.appendChild(sec('Fornecedores', `${rows.length} de ${FOR.length} fornecedores · valores por mês`, tabela([
      { t: 'Fornecedor', k: 'nome', cls: 'desc', f: v => h(trunc(v, 48)) }, { t: 'Categoria', k: 'cat' },
      ...MM.map((m, i) => ({ t: m, k: r => r.v[i], num: true, f: (v, r) => v ? `<span title="${r.lanc[i]} lançamentos">${fK(v)}</span>` : '<span style="color:var(--ink3)">·</span>' })),
      { t: 'Total 4 meses (R$)', k: 'tot', num: true, f: fR0 },
      { t: `% de ${MM[k]}`, k: r => totMes ? r.v[k] / totMes : 0, num: true, f: v => pctBar(v) },
      { t: 'Var vs mês anterior', k: r => (kp === null || !r.v[kp]) ? null : r.v[k] / r.v[kp] - 1, num: true, f: (v, r) => v === null ? (r.v[k] > 0 ? '<span class="tag A">NOVO</span>' : '–') : cor(-v, (v >= 0 ? '+' : '') + fP(v, 0)) },
      { t: 'Lanç. no mês', k: r => r.lanc[k], num: true, f: fN },
    ], rows, { alto: true, sort: 2 + k, total: (rs, c, i) => { if (i === 0) return 'TOTAL'; if (c.k === 'tot') return fR0(sum(rs, r => r.tot)); const j = MM.indexOf(c.t); if (j >= 0) return fK(sum(rs, r => r.v[j])); if (c.t === 'Lanç. no mês') return fN(sum(rs, r => r.lanc[k])); return ''; } })));
    out.appendChild(sec('Categorias de material', 'os mesmos quatro meses, agrupados', tabela([
      { t: 'Categoria', k: 'nome' }, ...MM.map((m, i) => ({ t: m, k: r => r.v[i], num: true, f: v => v ? fK(v) : '<span style="color:var(--ink3)">·</span>' })),
      { t: 'Total (R$)', k: 'tot', num: true, f: fR0 }, { t: `% de ${MM[k]}`, k: r => totMes ? r.v[k] / totMes : 0, num: true, f: v => pctBar(v) },
    ], CAT.filter(c => c.tot > 0), { sort: 2 + k, total: (rs, c, i) => { if (i === 0) return 'TOTAL'; const j = MM.indexOf(c.t); if (j >= 0) return fK(sum(rs, r => r.v[j])); if (c.k === 'tot') return fR0(sum(rs, r => r.tot)); return ''; } })));
    const prev = MS.find(x => x.mes.includes('previsto'));
    if (prev) out.appendChild(el('div', 'nota', `${h(prev.mes)} é mês não fechado: o valor de ${fR0(prev.total)} vem do analítico de apropriações do SIENGE (contas 2.07.09 e 2.07.28), com ${prev.lanc} lançamentos, e ainda não passou pelo fechamento do DRE. Os demais grupos de custo desse mês seguem em aberto.`));
  }
  bind();
}

/* ---------- 7. CONCILIAÇÃO DE FONTES ---------- */
function vConcil(root) {
  if (!SER.length) { root.appendChild(el('div', 'painel', 'A planilha de custos não trouxe a série mensal.')); return; }
  const norm = s => s.toLowerCase().replace('/26', '/26').trim();
  const linhas = SER.map(s => {
    const k = MESES.findIndex(m => norm(m) === norm(s.mes));
    const dre = k >= 0 ? { obra: GRUPOS[0].v[k], pessoal: GRUPOS[1].v[k], veic: GRUPOS[2].v[k], gerais: GRUPOS[3].v[k], adm: GRUPOS[4].v[k], total: CUSTO[k] } : null;
    return { mes: s.mes, k, pain: s, dre, dif: dre ? s.total - dre.total : null };
  });
  const comDif = linhas.filter(l => l.dif !== null && Math.abs(l.dif) > 1);
  const semDRE = linhas.filter(l => l.k < 0);
  const totPain = sum(SER, s => s.total), totDRE = T.custo;
  root.appendChild(el('div', 'kpis', [
    kpi('Custo total · DRE', fR0(totDRE), `${MESES.length} meses até ${MESES[NM - 1]}`),
    kpi('Custo total · Painel de Custos', fR0(totPain), `${SER.length} meses até ${SER[SER.length - 1].mes}`, 'ouro'),
    kpi('Diferença entre as fontes', fR0(totPain - totDRE), 'inclui o mês previsto', Math.abs(totPain - totDRE) > 1000 ? 'warn' : 'ok'),
    kpi('Meses divergentes', fN(comDif.length), `de ${linhas.length - semDRE.length} meses comparáveis`, comDif.length ? 'warn' : 'ok'),
    kpi('Meses só no painel', fN(semDRE.length), semDRE.map(l => l.mes).join(', ') || 'nenhum'),
  ].join('')));
  const p = el('div', 'painel', `${legHTML([['DRE (Consolidado)', css('--rec')], ['Painel de Custos', css('--cus')]])}<div class="ch alto"><canvas></canvas></div>`);
  root.appendChild(sec('Custo mensal nas duas fontes', 'mesma competência, bases diferentes', p));
  chart(p.querySelector('canvas'), { type: 'bar', data: { labels: linhas.map(l => l.mes), datasets: [
    { label: 'DRE', data: linhas.map(l => l.dre ? l.dre.total : null), backgroundColor: css('--rec'), borderRadius: 4 },
    { label: 'Painel', data: linhas.map(l => l.pain.total), backgroundColor: css('--cus'), borderRadius: 4 }] },
    options: { plugins: { tooltip: tipR }, datasets: { bar: { barPercentage: .85, categoryPercentage: .72 } } } });
  root.appendChild(sec('Comparativo mês a mês', 'diferença = painel menos DRE', tabela([
    { t: 'Mês', k: 'mes' },
    { t: 'Custo DRE (R$)', k: r => r.dre ? r.dre.total : null, num: true, f: v => v === null ? '<span style="color:var(--ink3)">sem DRE</span>' : fR(v) },
    { t: 'Custo Painel (R$)', k: r => r.pain.total, num: true, f: fR },
    { t: 'Diferença (R$)', k: 'dif', num: true, f: v => v === null ? '–' : (Math.abs(v) < 1 ? '<span style="color:var(--ok)">alinhado</span>' : `<span style="color:var(--warn);font-weight:700">${fR(v)}</span>`) },
    { t: 'Diferença (%)', k: r => (r.dre && r.dre.total) ? r.dif / r.dre.total : null, num: true, f: v => v === null ? '–' : fP(v) },
    { t: 'Onde está a diferença', k: r => { if (!r.dre || Math.abs(r.dif) < 1) return ''; const ds = [['Custo em Obra', r.pain.obra - r.dre.obra], ['Pessoal', r.pain.pessoal - r.dre.pessoal], ['Veículos/Máquinas', r.pain.veic - r.dre.veic], ['Gastos Gerais', r.pain.gerais - r.dre.gerais]].filter(d => Math.abs(d[1]) > 1).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])); return ds.map(d => `${d[0]} ${d[1] >= 0 ? '+' : ''}${fK(d[1])}`).join(' · '); } },
  ], linhas, { semSort: true, total: (rs, c, i) => ['TOTAL', fR(totDRE), fR(totPain), fR(totPain - totDRE), '', ''][i] })));
  const w = el('div', 'painel');
  w.innerHTML = `<div class="sec-h"><h2>Como ler as duas fontes</h2></div><dl class="dl" style="grid-template-columns:230px 1fr">
    <dt>DRE_754 · Consolidado</dt><dd>Fechamento contábil por competência, conta a conta, de ${h(MESES[0])} a ${h(MESES[NM - 1])}. É a base do resultado e da margem.</dd>
    <dt>Painel de Custos</dt><dd>Série de custo por grupo com um mês a mais, alimentada pelo analítico de apropriações do SIENGE. Serve para antecipar o mês que ainda não fechou.</dd>
    <dt>Quando divergem</dt><dd>Meses já fechados devem bater. Divergência em mês fechado indica lançamento reclassificado depois da extração do painel, e quem vale para o resultado é o DRE.</dd></dl>
    <div class="nota">${h(D.meta.nota_serie || '')}</div>`;
  root.appendChild(sec('Procedência', '', w));
  if ((D.fontes || []).length) root.appendChild(sec('Extrações registradas', 'aba Data Sources da planilha de custos', tabela([
    { t: 'Origem', k: 'origem' }, { t: 'Objeto', k: 'objeto', cls: 'desc', f: v => h(trunc(v, 70)) }, { t: 'Parâmetros', k: 'params', cls: 'desc', f: v => h(trunc(v, 60)) },
    { t: 'Extraído em', k: 'quando' }, { t: 'Linhas', k: 'linhas', num: true }, { t: 'Observação', k: 'nota', cls: 'desc', f: v => h(trunc(v, 60)) },
  ], D.fontes, { semSort: true })));
  if (comDif.length) root.appendChild(el('div', 'dica', `<b>Atenção na conciliação.</b> ${comDif.length} ${comDif.length === 1 ? 'mês diverge' : 'meses divergem'} entre as duas fontes (${comDif.map(l => l.mes).join(', ')}), somando ${fR0(sum(comDif, l => Math.abs(l.dif)))} em valor absoluto. Antes de levar qualquer número de custo para a diretoria, vale reconciliar esses meses: o DRE é a fonte do resultado, o painel é a fonte da antecipação.`));
}

/* ---------- init ---------- */
(function () {
  const m = document.getElementById('meta');
  m.innerHTML = `<div><small>Competência</small><b>${h(MESES[NM - 1])}</b></div><div><small>Meses</small><b>${fN(ATIVOS.length)}</b></div><div><small>Margem acum.</small><b>${fP(T.margem)}</b></div><div><small>Extraído em</small><b>${fmtData(D.meta.extraido_em)}</b></div>`;
  try { const v = localStorage.getItem('dre.view'); if (v && VIEWS.some(x => x[0] === v)) STATE.view = v; } catch (e) { }
  nav(); show();
})();

</script>
